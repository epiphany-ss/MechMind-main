<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习笔记 - 理论力学研究平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--ink:#263238;--muted:#718096;--blue:#2563eb;--paper:#fff;--bg:#f1f3f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Songti SC","Noto Serif SC",serif}.topbar{position:sticky;top:0;z-index:5;background:#ffffffed;border-bottom:1px solid #e2e8f0;backdrop-filter:blur(10px);padding:13px max(20px,calc((100% - 900px)/2));display:flex;justify-content:space-between;align-items:center;font-family:"Microsoft YaHei",sans-serif}.topbar a{color:var(--blue);text-decoration:none;font-size:.9rem}.topbar button{border:0;border-radius:7px;padding:8px 12px;background:#e0ecff;color:#1d4ed8;cursor:pointer;font-family:inherit}.paper{max-width:900px;min-height:calc(100vh - 60px);margin:28px auto;padding:66px 82px;background:var(--paper);box-shadow:0 3px 24px #33415512}.paper-header{border-bottom:1px solid #e2e8f0;padding-bottom:24px;margin-bottom:32px}.paper-header h1{font-size:2.2rem;line-height:1.25;margin:0 0 13px;color:#172033}.meta{font-family:"Microsoft YaHei",sans-serif;color:var(--muted);font-size:.82rem}.markdown{font-size:1.08rem;line-height:1.95}.markdown h1,.markdown h2,.markdown h3,.markdown h4{font-family:"Microsoft YaHei",sans-serif;color:#172033;line-height:1.4;margin:1.7em 0 .6em}.markdown h1{font-size:1.8rem;border-bottom:1px solid #e5e7eb;padding-bottom:8px}.markdown h2{font-size:1.45rem}.markdown h3{font-size:1.18rem;color:#1d4ed8}.markdown p{margin:1em 0}.markdown ul,.markdown ol{padding-left:2em}.markdown li{margin:.28em 0}.markdown blockquote{border-left:4px solid #93c5fd;background:#eff6ff;color:#475569;margin:1.2em 0;padding:10px 18px}.markdown code{background:#f1f5f9;border-radius:4px;padding:2px 5px;font-family:Consolas,monospace;font-size:.9em}.markdown pre{background:#172033;color:#e2e8f0;padding:16px;border-radius:8px;overflow:auto;line-height:1.55}.markdown pre code{background:none;padding:0;color:inherit}.markdown hr{border:0;border-top:1px solid #cbd5e1;margin:2em 0}.markdown a{color:#2563eb}.edit-area{display:none;width:100%;min-height:520px;border:1px solid #cbd5e1;border-radius:8px;padding:16px;font:1rem/1.7 Consolas,monospace}.editing .markdown{display:none}.editing .edit-area{display:block}.editing .edit-btn{display:none}.save-btn{display:none;background:#2563eb!important;color:#fff!important}.editing .save-btn{display:inline-block}.empty{text-align:center;color:var(--muted);font-family:"Microsoft YaHei",sans-serif;padding:70px 10px}@media(max-width:700px){.paper{margin:0;min-height:100vh;padding:38px 22px;box-shadow:none}.paper-header h1{font-size:1.7rem}.markdown{font-size:1rem}}
</style>
</head>
<body>
<nav class="topbar"><a href="learning_notes.html">← 返回学习记录</a><div><button class="edit-btn" onclick="toggleEdit()">编辑原文</button><button class="save-btn" onclick="saveNote()">保存修改</button></div></nav>
<main class="paper" id="paper"><div class="empty">正在加载学习笔记…</div></main>
<script src="js/learning-memory-api.js"></script>
<script>
const user=(()=>{try{return JSON.parse(localStorage.getItem('current_user')||'null')||{}}catch(e){return{}}})();
const noteId=new URLSearchParams(location.search).get('id');let note=null;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(text){let s=esc(text);const formulas=[];s=s.replace(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g,m=>{formulas.push(m);return `@@FORMULA${formulas.length-1}@@`});s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');formulas.forEach((f,i)=>{s=s.replace(`@@FORMULA${i}@@`,f)});return s}
function markdown(text){const lines=String(text||'').replace(/\r/g,'').split('\n'),out=[];let inCode=false,code=[];let listType=null;function closeList(){if(listType){out.push(`</${listType}>`);listType=null}}for(const line of lines){if(/^```/.test(line)){if(!inCode){closeList();inCode=true;code=[]}else{out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');inCode=false}continue}if(inCode){code.push(line);continue}if(!line.trim()){closeList();continue}let m;if((m=line.match(/^(#{1,4})\s+(.+)$/))){closeList();out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);continue}if(/^---+$/.test(line.trim())){closeList();out.push('<hr>');continue}if((m=line.match(/^>\s?(.*)$/))){closeList();out.push('<blockquote>'+inline(m[1])+'</blockquote>');continue}if((m=line.match(/^[-*+]\s+(.+)$/))){if(listType!=='ul'){closeList();out.push('<ul>');listType='ul'}out.push('<li>'+inline(m[1])+'</li>');continue}if((m=line.match(/^\d+\.\s+(.+)$/))){if(listType!=='ol'){closeList();out.push('<ol>');listType='ol'}out.push('<li>'+inline(m[1])+'</li>');continue}closeList();out.push('<p>'+inline(line)+'</p>')}closeList();if(inCode)out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');return out.join('')}
function render(){document.getElementById('paper').innerHTML=`<header class="paper-header"><h1>${esc(note.title)}</h1><div class="meta">状态：${esc(note.status)} · 更新时间：${esc(note.updated_at||note.created_at)} · 来源会话：${esc(note.conversation_id||'未知')}</div></header><section class="markdown">${markdown(note.markdown_content||note.structured_content?.summary||'暂无笔记内容')}</section><textarea class="edit-area" id="editor">${esc(note.markdown_content||'')}</textarea>`;const paint=()=>{if(window.renderMathInElement)renderMathInElement(document.querySelector('.markdown'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};paint();setTimeout(paint,500)}
function toggleEdit(){document.getElementById('paper').classList.toggle('editing')}
async function saveNote(){try{const r=await LearningMemoryAPI.updateNote(user,noteId,{markdown_content:document.getElementById('editor').value,status:'edited'});note=r.note;document.getElementById('paper').classList.remove('editing');render()}catch(e){alert('保存失败：'+e.message)}}
async function init(){if(!noteId){document.getElementById('paper').innerHTML='<div class="empty">缺少笔记 ID</div>';return}try{const r=await LearningMemoryAPI.getNote(user,noteId);note=r.note;render()}catch(e){document.getElementById('paper').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}init();
</script>
</body>
</html>
