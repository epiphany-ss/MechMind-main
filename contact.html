<style>
:root{--primary:#1a56db;--primary-dark:#0d3b9e;--primary-light:#e8f0fe;--accent:#f0a030;--bg:#f5f7fa;--card-bg:#fff;--text:#2c3e50;--text-light:#5a6c7d;--text-lighter:#8899aa;--border:#e2e8f0;--shadow:0 2px 12px rgba(0,0,0,0.08);--radius:12px;--transition:0.3s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.back-home{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--primary);color:#fff;text-decoration:none;border-radius:25px;font-weight:600;font-size:0.9em;transition:all var(--transition);position:fixed;top:16px;left:16px;z-index:100;box-shadow:0 4px 12px rgba(26,86,219,0.3)}
.back-home:hover{background:var(--primary-dark);transform:translateY(-2px)}
.page-header{background:linear-gradient(135deg,#6d28d9,#8b5cf6);color:#fff;padding:80px 32px 48px;text-align:center}
.page-header h1{font-size:2.2em;font-weight:800;letter-spacing:2px;margin-bottom:10px}
.page-header p{opacity:0.9;font-size:1.05em}
.container{max-width:860px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.contact-card{background:var(--card-bg);border-radius:var(--radius);padding:28px;border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;transition:all var(--transition)}
.contact-card:hover{transform:translateY(-3px);box-shadow:0 8px 40px rgba(0,0,0,0.12)}
.contact-card .c-icon{font-size:2.5em;margin-bottom:12px}
.contact-card h4{font-size:1.05em;margin-bottom:8px}
.contact-card p{color:var(--text-light);font-size:0.9em;line-height:1.7}
.map-card{background:var(--card-bg);border-radius:var(--radius);padding:24px;border:1px solid var(--border);box-shadow:var(--shadow);margin-top:24px}
.map-card h3{margin-bottom:16px}
.map-img{width:100%;height:280px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#dbeafe,#e0e7ff);display:flex;align-items:center;justify-content:center;color:var(--text-lighter);font-size:1.1em}
@media(max-width:600px){.container{grid-template-columns:1fr}.page-header{padding:60px 16px 24px}.page-header h1{font-size:1.4em}.back-home{padding:8px 14px;font-size:0.78em;top:8px;left:8px}}
@media(max-width:400px){.page-header{padding:50px 10px 18px}.page-header h1{font-size:1.15em}.container{padding:14px 8px}.contact-card{padding:14px}.contact-card h3{font-size:0.95em}.map-img{height:180px}}
