<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理论力学知识框架 · 思维导图</title>
<style>
:root {
  --bg: #060b14;
  --c0: #3b82f6; --c0g: #1d4ed8; --c0s: rgba(59,130,246,0.5);
  --c1: #f59e0b; --c1g: #d97706; --c1s: rgba(245,158,11,0.5);
  --c2: #ef4444; --c2g: #dc2626; --c2s: rgba(239,68,68,0.5);
  --c3: #a78bfa; --c3g: #7c3aed; --c3s: rgba(167,139,250,0.5);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:#e2e8f0;overflow:hidden;height:100vh;user-select:none;cursor:grab}
body:active{cursor:grabbing}
body.panning{cursor:grabbing}

#starCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#svgLayer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#svgLayer path{pointer-events:none}
#nodeLayer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}

.node-wrap{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;transition:filter 0.3s}
.node-wrap:hover{filter:brightness(1.3)}
.node-wrap .pill{padding:7px 16px;border-radius:22px;font-weight:700;text-align:center;white-space:nowrap;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);border:2px solid transparent;position:relative}
.node-wrap:hover .pill{transform:scale(1.08)}

.node-wrap.root .pill{font-size:22px;padding:20px 36px;border-radius:36px;
  background:radial-gradient(ellipse at center,rgba(59,130,246,0.3),transparent 70%),linear-gradient(135deg,#0f2b5c,#0d3b9e);
  color:#fff;border-color:rgba(96,165,250,0.6);letter-spacing:3px;
  box-shadow:0 0 40px rgba(59,130,246,0.35),0 0 80px rgba(59,130,246,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
.node-wrap.root .pill::after{content:'';position:absolute;inset:-3px;border-radius:38px;background:conic-gradient(from 0deg,#3b82f6,#8b5cf6,#3b82f6);opacity:0.3;z-index:-1;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.node-wrap.lv1 .pill{font-size:17px;padding:12px 28px;border-radius:26px;letter-spacing:1px}
.node-wrap.lv1 .pill.c0{background:linear-gradient(135deg,var(--c0g),var(--c0));color:#fff;border-color:#60a5fa;box-shadow:0 0 24px var(--c0s)}
.node-wrap.lv1 .pill.c1{background:linear-gradient(135deg,var(--c1g),var(--c1));color:#fff;border-color:#fbbf24;box-shadow:0 0 24px var(--c1s)}
.node-wrap.lv1 .pill.c2{background:linear-gradient(135deg,var(--c2g),var(--c2));color:#fff;border-color:#f87171;box-shadow:0 0 24px var(--c2s)}
.node-wrap.lv1 .pill.c3{background:linear-gradient(135deg,var(--c3g),var(--c3));color:#fff;border-color:#c4b5fd;box-shadow:0 0 24px var(--c3s)}

.node-wrap.lv2 .pill{font-size:13px;padding:6px 16px;border-radius:18px;
  background:rgba(20,30,50,0.92);color:#cbd5e1;border-color:rgba(100,116,139,0.3);backdrop-filter:blur(4px)}
.node-wrap.lv2 .pill.c0{border-color:rgba(59,130,246,0.4);color:#93c5fd}
.node-wrap.lv2 .pill.c1{border-color:rgba(245,158,11,0.4);color:#fcd34d}
.node-wrap.lv2 .pill.c2{border-color:rgba(239,68,68,0.4);color:#fca5a5}
.node-wrap.lv2 .pill.c3{border-color:rgba(167,139,250,0.4);color:#c4b5fd}

.node-wrap.lv3 .pill{font-size:11px;padding:4px 12px;border-radius:14px;
  background:rgba(15,23,42,0.85);color:#94a3b8;border-color:rgba(71,85,105,0.2)}
.node-wrap.lv3 .pill.c0{border-color:rgba(59,130,246,0.25);color:#60a5fa}
.node-wrap.lv3 .pill.c1{border-color:rgba(245,158,11,0.25);color:#fbbf24}
.node-wrap.lv3 .pill.c2{border-color:rgba(239,68,68,0.25);color:#f87171}
.node-wrap.lv3 .pill.c3{border-color:rgba(167,139,250,0.25);color:#a78bfa}

.node-wrap.lv4 .pill{font-size:10px;padding:3px 10px;border-radius:12px;
  background:rgba(15,23,42,0.7);color:#64748b;border-color:rgba(51,65,85,0.15)}

.node-wrap.has-kids .pill::after{content:' +';font-size:0.8em;opacity:0.4;margin-left:3px}
.node-wrap.expanded .pill::after{content:' −';font-size:0.8em;opacity:0.4;margin-left:3px}
.node-wrap.leaf .pill::after{content:' ↗';font-size:0.8em;opacity:0.4;margin-left:3px}
.node-wrap.leaf .pill{cursor:pointer}

/* Tooltip */
#tooltip{position:fixed;z-index:20;pointer-events:none;
  background:rgba(10,16,28,0.95);border:1px solid rgba(100,116,139,0.3);border-radius:10px;
  padding:10px 14px;font-size:12px;color:#e2e8f0;max-width:300px;display:none;

#tooltip .tt-title{font-weight:700;color:#fbbf24;margin-bottom:4px}
#tooltip .tt-desc{color:#94a3b8;font-size:11px}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.75);
  display:none;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}

@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:rgba(100,116,139,0.3);border-radius:4px}
.modal h3{font-size:1.4em;margin-bottom:6px;color:#fff;display:flex;align-items:center;gap:8px}
.modal .badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:0.55em;font-weight:800;letter-spacing:1px}
.badge-s{background:rgba(59,130,246,0.2);color:#60a5fa;border:1px solid rgba(59,130,246,0.3)}
.badge-k{background:rgba(245,158,11,0.2);color:#fbbf24;border:1px solid rgba(245,158,11,0.3)}
.badge-d{background:rgba(239,68,68,0.2);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.badge-a{background:rgba(167,139,250,0.2);color:#c4b5fd;border:1px solid rgba(167,139,250,0.3)}
.modal .breadcrumb{font-size:0.75em;color:#64748b;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(100,116,139,0.15)}
.modal .detail-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.modal .detail-list li{padding:8px 12px;background:rgba(30,41,59,0.5);border-radius:8px;font-size:0.85em;color:#cbd5e1;border:1px solid rgba(100,116,139,0.1)}
.modal .detail-list li::before{content:'▸ ';color:#60a5fa;font-size:0.8em}
.modal .link-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.modal .link-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;

.modal .close-btn{position:absolute;top:14px;right:18px;background:rgba(100,116,139,0.15);
  border:none;color:#94a3b8;font-size:1.3em;cursor:pointer;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.modal .close-btn:hover{background:rgba(239,68,68,0.3);color:#f87171}

/* Legend & Controls */
.legend{position:fixed;bottom:22px;left:22px;z-index:10;font-size:11px;color:#64748b;display:flex;gap:18px}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor}
.controls{position:fixed;bottom:20px;right:20px;z-index:10;display:flex;gap:8px}
.controls button{padding:7px 16px;border-radius:16px;border:1px solid rgba(100,116,139,0.25);
  background:rgba(20,30,50,0.85);color:#cbd5e1;cursor:pointer;font-size:12px;
  transition:all 0.2s;backdrop-filter:blur(4px)}
.controls button:hover{background:rgba(59,130,246,0.2);border-color:#3b82f6;color:#fff}

.tip{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;
  font-size:12px;color:#475569;pointer-events:none;letter-spacing:0.5px}

/* Nav buttons */
.nav-btns{position:fixed;top:16px;left:16px;z-index:50;display:flex;gap:8px}
.nav-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;
  border-radius:20px;font-weight:700;font-size:0.82em;text-decoration:none;
  transition:all 0.2s;cursor:pointer;border:none}
.nav-btn.home{background:rgba(59,130,246,0.85);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,0.3)}
.nav-btn.home:hover{background:#3b82f6;transform:translateY(-2px);box-shadow:0 6px 16px rgba(59,130,246,0.45)}
.nav-btn.back{background:rgba(30,41,59,0.85);color:#cbd5e1;border:1px solid rgba(100,116,139,0.3);backdrop-filter:blur(4px)}
.nav-btn.back:hover{background:rgba(51,65,85,0.9);color:#fff;transform:translateY(-2px)}
</style>
</head>

<script>
// ==================== STARFIELD BACKGROUND ====================
(function(){
  const c=document.getElementById('starCanvas'),ctx=c.getContext('2d');
  let W,H,stars=[],dust=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);

  for(let i=0;i<280;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+0.3,
    twinkle:Math.random()*Math.PI*2,speed:Math.random()*0.02+0.005,alpha:Math.random()});
  for(let i=0;i<40;i++) dust.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*60+20,
    vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,alpha:Math.random()*0.03+0.01,
    hue:200+Math.random()*60});

  function draw(){
    ctx.clearRect(0,0,W,H);
    // Gradient bg
    const g=ctx.createRadialGradient(W*0.3,H*0.3,0,W*0.5,H*0.5,Math.max(W,H)*0.8);
    g.addColorStop(0,'#0a1628');g.addColorStop(0.5,'#060e1c');g.addColorStop(1,'#020810');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // Dust
    dust.forEach(d=>{
      d.x+=d.vx;d.y+=d.vy;
      if(d.x<-d.r)d.x=W+d.r;if(d.x>W+d.r)d.x=-d.r;
      if(d.y<-d.r)d.y=H+d.r;if(d.y>H+d.r)d.y=-d.r;
      const g2=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
      g2.addColorStop(0,`hsla(${d.hue},50%,40%,${d.alpha})`);
      g2.addColorStop(1,'transparent');
      ctx.fillStyle=g2;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
    });

    // Stars
    stars.forEach(s=>{
      s.twinkle+=s.speed;
      const a=(Math.sin(s.twinkle)*0.5+0.5)*0.7+0.3;
      ctx.fillStyle=`rgba(200,220,255,${a*s.alpha})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      if(s.r>1.2){ctx.fillStyle=`rgba(200,220,255,${a*s.alpha*0.3})`;
        ctx.beginPath();ctx.arc(s.x,s.y,s.r*2.5,0,Math.PI*2);ctx.fill()}
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ==================== STATE ====================
let expanded=new Set(['root']);
let panX=0,panY=0,scale=1;
let isPanning=false,startX,startY;
const INITIAL_LEVEL=1;

// Init: show root + 4 branches
treeData.children.forEach(c=>expanded.add(c.id));

// ==================== LAYOUT ====================
function getLayout(){
  const w=window.innerWidth,h=window.innerHeight,cx=w/2,cy=h/2;
  const pos=new Map();
  const angles=[Math.PI*0.78,Math.PI*0.22,-Math.PI*0.22,-Math.PI*0.78];

  function place(node,ang,rad,span,lv){
    const x=cx+rad*Math.cos(ang)+panX,y=cy+rad*Math.sin(ang)+panY;
    pos.set(node.id,{x,y,lv,node});
    if(!node.children||!expanded.has(node.id))return;
    const n=node.children.length;
    const cr=rad+(lv===0?180:lv===1?150:lv===2?125:105);
    const ca=span*0.82;
    const sa=ang-ca/2;
    const gap=n>1?ca/(n-1):0;
    node.children.forEach((c,i)=>place(c,n===1?ang:sa+i*gap,cr,gap,lv+1));
  }
  pos.set('root',{x:cx+panX,y:cy+panY,lv:0,node:treeData});
  treeData.children.forEach((c,i)=>place(c,angles[i],170,Math.PI*0.38,1));
  return{pos,cx,cy};
}

// ==================== RENDER ====================
const svgL=document.getElementById('svgLayer');
const nodeL=document.getElementById('nodeLayer');

function render(){
  const{pos}=getLayout();
  // SVG paths
  let paths='';
  function drawPaths(node,pc){
    if(!pos.has(node.id))return;
    const p=pos.get(node.id);
    if(node.children&&expanded.has(node.id)){
      node.children.forEach(c=>{
        if(!pos.has(c.id))return;
        const cp=pos.get(c.id);
        const dx=cp.x-p.x,dy=cp.y-p.y;
        const mx=p.x+dx*0.45,my=p.y+dy*0.45;
        const lw=cp.lv<=2?2.5:cp.lv<=3?1.5:0.8;
        const op=cp.lv<=2?0.45:cp.lv<=3?0.22:0.1;
        const clr=pc>=0?BRANCH_COLORS[pc]:'#64748b';
        paths+=`<path d="M${p.x},${p.y} Q${mx},${my} ${cp.x},${cp.y}" stroke="${clr}" stroke-width="${lw}" fill="none" opacity="${op}" stroke-linecap="round"/>`;
        drawPaths(c,pc>=0?pc:node.color);
      });
    }
  }
  treeData.children.forEach((c,i)=>drawPaths(c,i));
  svgL.innerHTML=paths;

  // HTML nodes
  let html='';
  pos.forEach((p,id)=>{
    const n=p.node;
    const lvCls=p.lv===0?'root':`lv${Math.min(p.lv,4)}`;
    const cCls=n.color>=0?` ${COLORS[n.color]}`:'';
    const isExp=expanded.has(id);
    const hasKids=n.children&&n.children.length>0;
    const kidCls=hasKids?(isExp?'expanded':'has-kids'):'leaf';
    html+=`<div class="node-wrap ${lvCls} ${kidCls}" id="n_${id}" style="left:${p.x}px;top:${p.y}px" data-id="${id}" data-lv="${p.lv}" onclick="handleClick('${id}')" onmouseenter="showTT(event,'${id}')" onmouseleave="hideTT()"><span class="pill${cCls}">${n.label}</span></div>`;
  });
  nodeL.innerHTML=html;

  // Update parent refs for visibility
  function setParent(node,pid){node.parentId=pid;if(node.children)node.children.forEach(c=>setParent(c,node.id))}
  treeData.children.forEach(c=>setParent(c,'root'));
}

// ==================== INTERACTION ====================
function handleClick(id){
  const n=findNode(treeData,id);if(!n)return;
  if(n.children&&n.children.length>0){
    if(expanded.has(id))collapse(id);
    else{expanded.add(id);n.children.forEach(c=>expanded.add(c.id))}
    render();
  }else{showModal(n)}
}
function collapse(id){
  expanded.delete(id);
  const n=findNode(treeData,id);
  if(n&&n.children)n.children.forEach(c=>collapse(c.id));
}
function findNode(t,id){
  if(t.id===id)return t;
  if(t.children)for(const c of t.children){const r=findNode(c,id);if(r)return r}
  return null;
}

// ==================== MODAL ====================
function showModal(node){
  const path=[];(function fp(t,id,p){if(t.id===id){path.push(...p,t);return true}if(t.children)for(const c of t.children)if(fp(c,id,[...p,t]))return true;return false})(treeData,node.id,[]);
  const bc=path.slice(1).map(n=>n.label).join(' › ');
  const topSect=path[1]||{};
  const sectKey=topSect.id||'';
  const badgeCls=topSect.color>=0?BADGES[topSect.color]:'badge-s';
  const sectName=topSect.color>=0?SECTIONS[topSect.color]:'';
  const link=TB_LINKS[node.id]||TB_LINKS['s1a'];

  let det='';
  if(node.detail&&node.detail.length>0)det='<ul class="detail-list">'+node.detail.map(d=>`<li>${d}</li>`).join('')+'</ul>';

  document.getElementById('modalContent').innerHTML=`
    <h3>${node.label}<span class="badge ${badgeCls}">${sectName}</span></h3>
    <div class="breadcrumb">${bc}</div>
    ${det}
    <div class="link-row">
      <a class="link-btn" href="${link}" target="_blank">📖 查看详细知识框架 →</a>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

// ==================== TOOLTIP ====================
function showTT(e,id){
  const n=findNode(treeData,id);if(!n)return;
  const tt=document.getElementById('tooltip');
  if((!n.children||n.children.length===0)&&n.detail){tt.innerHTML=`<div class="tt-title">${n.label}</div><div class="tt-desc">${n.detail.join(' · ')} · 点击查看详情</div>`;tt.style.display='block';tt.style.left=(e.clientX+16)+'px';tt.style.top=(e.clientY-12)+'px'}
  else if(n.desc){tt.innerHTML=`<div class="tt-title">${n.label}</div><div class="tt-desc">${n.desc} · 点击展开</div>`;tt.style.display='block';tt.style.left=(e.clientX+16)+'px';tt.style.top=(e.clientY-12)+'px'}
  else{tt.style.display='none'}
}
function hideTT(){document.getElementById('tooltip').style.display='none'}

// ==================== PAN/ZOOM ====================
window.addEventListener('mousedown',e=>{if(e.target.closest('.node-wrap')||e.target.closest('.modal-overlay'))return;isPanning=true;startX=e.clientX-panX;startY=e.clientY-panY;document.body.classList.add('panning')});
window.addEventListener('mousemove',e=>{if(!isPanning)return;panX=e.clientX-startX;panY=e.clientY-startY;render()});
window.addEventListener('mouseup',()=>{isPanning=false;document.body.classList.remove('panning')});
window.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?0.9:1.1;scale=Math.max(0.3,Math.min(3,scale*d));panX=e.clientX-(e.clientX-panX)*d;panY=e.clientY-(e.clientY-panY)*d;render()},{passive:false});

// ==================== CONTROLS ====================
function expandAll(){(function add(n){expanded.add(n.id);if(n.children)n.children.forEach(add)})(treeData);render()}
function collapseToLv(lv){expanded.clear();expanded.add('root');(function add(n,l){if(l<=lv){expanded.add(n.id);if(n.children)n.children.forEach(c=>add(c,l+1))}})(treeData,0);render()}
function resetView(){panX=0;panY=0;scale=1;expanded.clear();expanded.add('root');treeData.children.forEach(c=>expanded.add(c.id));render()}

// ==================== INIT ====================
render();
</script>
