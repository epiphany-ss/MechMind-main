/* 标签是三维坐标投影到屏幕的 DOM 浮层——天然正对镜头，转到任何角度都清晰可读 */
.node-wrap{position:absolute;top:0;left:0;transform-origin:0 0;pointer-events:auto;cursor:pointer;will-change:transform}
.node-face{display:inline-block;position:relative;transition:filter 0.3s}
.node-wrap:hover .node-face{filter:brightness(1.3)}
.node-wrap .pill{padding:7px 16px;border-radius:22px;font-weight:700;text-align:center;white-space:nowrap;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);border:2px solid transparent;position:relative;display:inline-block}
.node-wrap:hover .pill{transform:scale(1.08)}

.node-wrap.root .pill{font-size:17px;padding:11px 24px;border-radius:26px;
  background:radial-gradient(ellipse at center,rgba(59,130,246,0.3),transparent 70%),linear-gradient(135deg,#0f2b5c,#0d3b9e);
  color:#fff;border-color:rgba(96,165,250,0.6);letter-spacing:3px;
  box-shadow:0 0 40px rgba(59,130,246,0.35),0 0 80px rgba(59,130,246,0.15),inset 0 1px 0 rgba(255,255,255,0.1)}
.node-wrap.root .pill::after{content:'';position:absolute;inset:-3px;border-radius:38px;background:conic-gradient(from 0deg,#3b82f6,#8b5cf6,#3b82f6);opacity:0.3;z-index:-1;animation:spin 4s linear infinite}

.node-wrap.lv1 .pill{font-size:13px;padding:7px 16px;border-radius:20px;letter-spacing:0.5px}
.node-wrap.lv1 .pill.c0{background:linear-gradient(135deg,var(--c0g),var(--c0));color:#fff;border-color:#60a5fa;box-shadow:0 0 24px var(--c0s)}
.node-wrap.lv1 .pill.c1{background:linear-gradient(135deg,var(--c1g),var(--c1));color:#fff;border-color:#fbbf24;box-shadow:0 0 24px var(--c1s)}
.node-wrap.lv1 .pill.c2{background:linear-gradient(135deg,var(--c2g),var(--c2));color:#fff;border-color:#f87171;box-shadow:0 0 24px var(--c2s)}
.node-wrap.lv1 .pill.c3{background:linear-gradient(135deg,var(--c3g),var(--c3));color:#fff;border-color:#c4b5fd;box-shadow:0 0 24px var(--c3s)}

<script>
// ==================== STARFIELD BACKGROUND ====================
(function(){
  const c=document.getElementById('starCanvas'),ctx=c.getContext('2d');
  let W,H,stars=[],dust=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);

  for(let i=0;i<280;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+0.3,
    twinkle:Math.random()*Math.PI*2,speed:Math.random()*0.02+0.005,alpha:Math.random()});
  for(let i=0;i<40;i++) dust.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*60+20,
    vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,alpha:Math.random()*0.03+0.01,
    hue:200+Math.random()*60});

  function draw(){
    ctx.clearRect(0,0,W,H);
    // Gradient bg
    const g=ctx.createRadialGradient(W*0.3,H*0.3,0,W*0.5,H*0.5,Math.max(W,H)*0.8);
    g.addColorStop(0,'#0a1628');g.addColorStop(0.5,'#060e1c');g.addColorStop(1,'#020810');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // Dust
    dust.forEach(d=>{
      d.x+=d.vx;d.y+=d.vy;
      if(d.x<-d.r)d.x=W+d.r;if(d.x>W+d.r)d.x=-d.r;
      if(d.y<-d.r)d.y=H+d.r;if(d.y>H+d.r)d.y=-d.r;
      const g2=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
      g2.addColorStop(0,`hsla(${d.hue},50%,40%,${d.alpha})`);
      g2.addColorStop(1,'transparent');
      ctx.fillStyle=g2;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
    });

    // Stars
    stars.forEach(s=>{
      s.twinkle+=s.speed;
      const a=(Math.sin(s.twinkle)*0.5+0.5)*0.7+0.3;
      ctx.fillStyle=`rgba(200,220,255,${a*s.alpha})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      if(s.r>1.2){ctx.fillStyle=`rgba(200,220,255,${a*s.alpha*0.3})`;
        ctx.beginPath();ctx.arc(s.x,s.y,s.r*2.5,0,Math.PI*2);ctx.fill()}
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function courseNodeOf(label){

const NODE_SECTION={};
function tagSections(){
  treeData.children.forEach(function(sec,i){
    (function walk(n){ NODE_SECTION[n.id]=i; (n.children||[]).forEach(walk); })(sec);
  });

// 返回 {url, kind}：point=直达具体知识点 · section=退到该篇教材 · ai=站内没有，去问答
function kpTargetFor(node){
  if(!node) return {url:'index.html', kind:'point'};
  const direct=node.isNet?null:TB_LINKS[node.id];                                   // ①
  if(direct) return {url:direct, kind:'point'};
  const byName=(window.SITE_LINKS||{})[node.label]||(window.CONCEPT_LINKS||{})[node.label];  // ②
  if(byName) return {url:byName, kind:'point'};
  const gen=(window.KP_LINKS||{})[node.label];                                      // ③
  if(gen) return {url:gen.url, kind:gen.url.indexOf('?target=')>0?'point':'section'};
  // ④ 个人知识网络注入的节点：上三级都没命中 = 四篇教材里确实没有这部分内容
  //    （材料力学那些，以及陀螺仪/进动/泊松括号这类超纲的，都在这一批）
  //    → 不再往教材首页硬塞，直接带着问题去 AI 问答
  if(node.isNet) return {url:'ai_qa.html?q='+encodeURIComponent(node.label)+'&mode=enhanced', kind:'ai'};
  const cn=courseNodeOf(node.label);                                                // ⑤ 图谱自身的篇章/主题：退到该篇
  if(cn&&HEX_BOOK[cn.color]) return {url:HEX_BOOK[cn.color], kind:'section'};
  const sec=NODE_SECTION[node.id];
  if(sec>=0&&sec!=null&&SECTION_BOOK[sec]) return {url:SECTION_BOOK[sec], kind:'section'};
  return {url:'ai_qa.html?q='+encodeURIComponent(node.label)+'&mode=enhanced', kind:'ai'};
}
function kpUrlFor(node){ return kpTargetFor(node).url; }

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}

const UP=new THREE.Vector3(0,1,0);

function addSeg(p0,p1,r0,r1,mat){
  const dir=new THREE.Vector3().subVectors(p1,p0);
  const len=dir.length();
  if(len<1e-4) return;
  const geo=new THREE.CylinderGeometry(r1,r0,len,10,1,true);   // 开口圆柱，省掉两端面
  geo.translate(0,len/2,0);
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.copy(p0);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  treeGroup.add(mesh);
}

// 子枝方向：绕父枝轴均匀铺开，再向上抬一点——这是树能"参天"而不是摊平的关键
function childDir(parentDir, i, n, depth, rnd){
  const axis=parentDir.clone().normalize();
  const ref=Math.abs(axis.y)>0.92 ? new THREE.Vector3(1,0,0) : UP;
  const u=new THREE.Vector3().crossVectors(axis,ref).normalize();
  const v=new THREE.Vector3().crossVectors(axis,u).normalize();
  // 张开角和方位角都加随机扰动——枝条不再是规整的伞骨，彼此会交错穿插
  const spread=0.78+depth*0.07 + (rnd()-0.5)*0.34;
  const az=(i/n)*Math.PI*2 + (rnd()-0.5)*1.6;
  const d=axis.clone().multiplyScalar(Math.cos(spread))
      .addScaledVector(u, Math.sin(spread)*Math.cos(az))
      .addScaledVector(v, Math.sin(spread)*Math.sin(az));
  d.y+=0.03;                     // 几乎不上抬，树冠向四周大幅铺开
  return d.normalize();
}

// 叶子用 InstancedMesh 批量画：几万片也只有 4 次绘制调用，才敢把树冠堆到"密不透风"
const LEAF_PER_TIP=160;    // 每个末端知识点的叶簇大小（调大：树冠更饱满）
const LEAF_R=195;          // 叶簇半径（调大：相邻枝条的叶簇会彼此交汇、连成一片树冠，铺满画面四角）
let leafXforms=[[],[],[],[]];

function addLeafCluster(pos, li, rnd){
  const N=LEAF_PER_TIP, R=LEAF_R;
  const _p=new THREE.Vector3(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _s=new THREE.Vector3();
  for(let i=0;i<N;i++){
    // 球体内均匀取点（cbrt 让叶子填满整个球，而不是只贴在壳上）
    const u=rnd()*2-1, th=rnd()*Math.PI*2, rad=R*Math.cbrt(rnd());
    const sx=Math.sqrt(1-u*u);
    _p.copy(pos).add(new THREE.Vector3(rad*sx*Math.cos(th), rad*u*0.85, rad*sx*Math.sin(th)));
    _e.set(rnd()*Math.PI, rnd()*Math.PI*2, rnd()*Math.PI);
    _q.setFromEuler(_e);
    _s.setScalar(5.5+rnd()*7);
    leafXforms[li].push(new THREE.Matrix4().compose(_p,_q,_s));
  }
}

function flushLeaves(){
  for(let li=0;li<4;li++){
    const arr=leafXforms[li];
    if(!arr.length) continue;
    const im=new THREE.InstancedMesh(LEAF_GEO, LEAF_MATS[li], arr.length);
    for(let i=0;i<arr.length;i++) im.setMatrixAt(i, arr[i]);
    im.instanceMatrix.needsUpdate=true;
    im.frustumCulled=false;
    treeGroup.add(im);
  }
}

function addLabel(node, pos3, depth, li){
  const el=document.createElement('div');
  const hasKids=!!(node.children&&node.children.length);
  const kidCls=hasKids?(expanded.has(node.id)?' expanded':' has-kids'):' leaf';
  const lvCls=depth===0?'root':'lv'+Math.min(depth,3);
  const cCls=li>=0?' '+COLORS[li]:'';
  el.className='node-wrap '+lvCls+kidCls;
  const kp=kpTargetFor(node);
  const kpHint=kp.kind==='ai'?'站内暂无这个知识点，去 AI 问答提问：'
              :(kp.kind==='section'?'到该篇教材中查看：':'直达知识点：');
  el.innerHTML='<span class="node-face"><span class="pill'+cCls+'">'+node.label+'</span>'
    +'<a class="kf-jump'+(kp.kind==='ai'?' to-ai':'')+'" href="'+kp.url+'" target="_blank" title="'+kpHint+node.label+'">'+(kp.kind==='ai'?'🤖':'🧭')+'</a>'
    +'</span>';
  const jumpEl=el.querySelector('.kf-jump');
  jumpEl.addEventListener('click', function(e){    // 点徽标只跳转，不触发展开/弹窗
    e.stopPropagation();
    if(moved){ e.preventDefault(); return; }       // 刚才是拖动转树，不是点徽标
    hideTT();
  });
  el.addEventListener('click', function(e){
    e.stopPropagation();
    if(moved) return;                     // 刚才是拖动转树，不是点击
    handleClick(node.id);
  });
  el.addEventListener('mouseenter', function(e){showTT(e, node.id);});
  el.addEventListener('mouseleave', hideTT);
  labelLayer.appendChild(el);
  labels.push({el:el, pos:pos3.clone(), depth:depth});
}

// 递归生长：一截枝分两段带点弯，末端挂标签、长叶子或继续分叉
function grow(node, p0, dir, len, r0, depth, li){
  const rnd=mulberry32(seedOf(node.id));
  const r1=r0*0.60;
  const mid=p0.clone().addScaledVector(dir, len*0.5);
  const dir2=dir.clone().add(new THREE.Vector3(0,0.035,0)).normalize();
  const end=mid.clone().addScaledVector(dir2, len*0.5);
  const mat=BRANCH_MATS[li>=0?li:0];
  addSeg(p0, mid, r0, (r0+r1)/2, mat);
  addSeg(mid, end, (r0+r1)/2, r1, mat);

  addLabel(node, end, depth, li);

  const kids=visibleKids(node);
  if(!kids){
    addLeafCluster(end, li>=0?li:0, rnd);
    return;
  }
  kids.forEach(function(c,i){
    grow(c, end, childDir(dir2, i, kids.length, depth, rnd), len*0.84, r1, depth+1, li);
  });
}

function buildTree(){
  const TRUNK_TOP=132, TRUNK_R=28;

  // 树干：一个旋转体，底部按角度做周期调制，直接"长"出板根。
  // 比用一堆圆柱去拼板根干净得多——根和干是同一个曲面，没有穿插缝隙。
  // 底部收得更窄、往下扎得更深，避免摊成一个扁平的星形
  const prof=[[80,-112],[74,-92],[60,-64],[47,-32],[39,6],[34,46],[31,86],[TRUNK_R,TRUNK_TOP]]
    .map(function(p){return new THREE.Vector2(p[0],p[1]);});
  const tGeo=new THREE.LatheGeometry(prof, 96, 0, Math.PI*2);
  const LO=9, R_TOP=-10, R_BOT=-112;                          // 9 条棱脊，振幅收敛
  const pa=tGeo.attributes.position;
  for(let i=0;i<pa.count;i++){
    const x=pa.getX(i), y=pa.getY(i), z=pa.getZ(i);
    const r=Math.hypot(x,z); if(r<1e-6) continue;
    const t=clamp((R_TOP-y)/(R_TOP-R_BOT), 0, 1);             // 越靠底部，棱脊越强
    const amp=1 + 0.24*t*t*Math.cos(LO*Math.atan2(z,x));
    pa.setX(i, x*amp); pa.setZ(i, z*amp);
  }
  tGeo.computeVertexNormals();
  treeGroup.add(new THREE.Mesh(tGeo, TRUNK_MAT));

  addLabel(treeData, new THREE.Vector3(0,-196,0), 0, -1);     // 根节点挂在树基下方

  const limbs=visibleKids(treeData)||[];
  limbs.forEach(function(c,i){
    const az=(i/limbs.length)*Math.PI*2 + 0.4;                // 360° 均匀分布
    const spread=1.12;                                        // 主枝更向外张开：树冠横铺到画面左右两侧
    const d=new THREE.Vector3(Math.sin(spread)*Math.sin(az), Math.cos(spread), Math.sin(spread)*Math.cos(az)).normalize();
    grow(c, new THREE.Vector3(0,TRUNK_TOP,0), d, 335, TRUNK_R, 1, i);
  });

  flushLeaves();          // 所有叶簇一次性实例化提交
}

function clearTree(){
  treeGroup.traverse(function(o){
    if(o.isMesh && o.geometry && o.geometry!==LEAF_GEO) o.geometry.dispose();
  });
  treeGroup.clear();
  leafXforms=[[],[],[],[]];
  labels.forEach(function(l){l.el.remove();});
  labels=[];
}

// ==================== 相机与交互 ====================
function updateCamera(){
  const sp=Math.sin(camPhi), cp=Math.cos(camPhi);
  camera.position.set(
    camTarget.x + camDist*sp*Math.sin(camTheta),
    camTarget.y + camDist*cp,
    camTarget.z + camDist*sp*Math.cos(camTheta)
  );
  camera.lookAt(camTarget);
}
function fitCamera(){
  const box=new THREE.Box3().setFromObject(treeGroup);
  labels.forEach(function(l){box.expandByPoint(l.pos);});   // 标签也算进取景范围，否则树冠会被切顶
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  // 视线压低到树心以下：树冠整体被顶到画面上方，铺满并溢出屏幕顶部，
  // 树干与树根顺势落到画面下半部/画面外——一进页面就是"满屏枝叶"。
  camTarget.set(0, center.y - size.y*0.24, 0);
  camDist=Math.max(size.x, size.y, size.z)*0.70;   // 刻意放大：树冠大幅溢出画面边缘，四角也铺满枝叶
  updateCamera();
}

// 拖动可以落在整屏任何位置，**包括标签上**。
// 树冠铺满屏幕后满屏都是标签，如果按在标签上就 return，用户会以为"拖不动"。
// 用移动距离阈值区分"点击标签"和"拖动转树"：位移超过 4px 就算拖动，不再触发点击。
const DRAG_TOL=4;
window.addEventListener('pointerdown', function(e){
  if(e.target.closest('.modal-overlay')||e.target.closest('.controls')||e.target.closest('.nav-btns')) return;
  dragging=true; dragMode=(e.button===2?2:1);
  downX=lastX=e.clientX; downY=lastY=e.clientY; moved=false;
  autoSpin=false;
});
window.addEventListener('pointermove', function(e){
  if(!dragging) return;
  if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>DRAG_TOL) moved=true;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  if(dragMode===1){
    camTheta -= dx*0.0062;                                  // 左右拖动：绕树转一圈
    camPhi   = clamp(camPhi - dy*0.0062, 0.22, 1.50);       // 上下拖动：俯仰
  }else{
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    const k=camDist*0.0016;
    camTarget.addScaledVector(right, -dx*k).addScaledVector(up, dy*k);
  }
  updateCamera();
});
window.addEventListener('pointerup', function(){dragging=false;});
window.addEventListener('pointercancel', function(){dragging=false;});
glHost.addEventListener('contextmenu', function(e){e.preventDefault();});
glHost.addEventListener('wheel', function(e){
  e.preventDefault();
  camDist=clamp(camDist*(e.deltaY>0?1.09:0.917), 150, 5000);
  updateCamera();
},{passive:false});

// ==================== 标签投影 ====================
const _v=new THREE.Vector3();
function projectLabels(){
  const w=window.innerWidth, h=window.innerHeight;
  const cand=[];
  for(let i=0;i<labels.length;i++){
    const L=labels[i];
    _v.copy(L.pos).project(camera);
    if(_v.z>1){ L.el.style.display='none'; continue; }        // 跑到相机背后的不画
    L._x=(_v.x*0.5+0.5)*w;
    L._y=(-_v.y*0.5+0.5)*h;
    L._z=_v.z;
    if(L.w===undefined){ L.w=L.el.offsetWidth; L.h=L.el.offsetHeight; }
    cand.push(L);
  }
  // 层级浅的优先、离相机近的优先；跟已放置的标签压住就暂时隐藏
  cand.sort(function(a,b){ return (a.depth-b.depth) || (a._z-b._z); });
  const placed=[];
  for(let i=0;i<cand.length;i++){
    const L=cand[i];
    const hw=L.w/2+3, hh=L.h/2+3;
    let hit=false;
    for(let j=0;j<placed.length;j++){
      if(Math.abs(L._x-placed[j].x)<hw+placed[j].hw && Math.abs(L._y-placed[j].y)<hh+placed[j].hh){hit=true;break;}
    }
    if(hit){ L.el.style.display='none'; continue; }            // 放大后重叠消失，标签会自己浮现
    placed.push({x:L._x, y:L._y, hw:hw, hh:hh});
    L.el.style.display='';
    L.el.style.transform='translate(-50%,-50%) translate('+L._x.toFixed(1)+'px,'+L._y.toFixed(1)+'px)';
    L.el.style.zIndex=String(Math.round((1-L._z)*100000));
    L.el.style.opacity=(1-clamp((L._z+1)/2,0,1)*0.35).toFixed(2);   // 远处的淡一点，强化纵深
  }
}

// ==================== INTERACTION ====================
function findNode(t,id){
  if(t.id===id)return t;
  if(t.children)for(let i=0;i<t.children.length;i++){const r=findNode(t.children[i],id);if(r)return r}
  return null;
}
function collapse(id){
  expanded.delete(id);
  const n=findNode(treeData,id);
  if(n&&n.children)n.children.forEach(function(c){collapse(c.id);});
}
function handleClick(id){
  const n=findNode(treeData,id);if(!n)return;
  if(n.children&&n.children.length>0){
    if(expanded.has(id))collapse(id);
    else{expanded.add(id);n.children.forEach(function(c){expanded.add(c.id);});}
    rebuild();
  }else{showModal(n)}
}
function rebuild(){ clearTree(); buildTree(); fitCamera(); }

// ==================== MODAL ====================
function showModal(node){
  const path=[];(function fp(t,id,p){if(t.id===id){path.push.apply(path,p);path.push(t);return true}if(t.children)for(const c of t.children)if(fp(c,id,p.concat([t])))return true;return false})(treeData,node.id,[]);
  const bc=path.slice(1).map(function(n){return n.label;}).join(' › ');
  const topSect=path[1]||{};
  const badgeCls=topSect.color>=0?BADGES[topSect.color]:'badge-s';
  const sectName=topSect.color>=0?SECTIONS[topSect.color]:'';
  const isNet=!!node.isNet;
  const kp=kpTargetFor(node);            // 站点里对应的知识点；站内没有则是 AI 问答提问
  const kpLabel=kp.kind==='ai' ? '🤖 站内暂无 · 去 AI 问答提问 →'
              : (kp.kind==='section' ? '🧭 到该篇教材中查看 →' : '🧭 直达知识点 →');

  let det='';
  if(isNet){
    // 来自个人知识网络的节点：显示说明 + 类型/掌握状态
    const meta=[TYPE_NAME[node.ntype]||'', STATUS_NAME[node.nstatus]||''].filter(Boolean).join(' · ');
    det=(node.note?'<div class="net-note">'+node.note+'</div>':'')
       +(meta?'<div class="net-meta">'+meta+'</div>':'');
  }else if(node.detail&&node.detail.length>0){
    det='<ul class="detail-list">'+node.detail.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul>';
  }

  document.getElementById('modalContent').innerHTML=
    '<h3>'+node.label+'<span class="badge '+badgeCls+'">'+sectName+'</span></h3>'
    +'<div class="breadcrumb">'+bc+'</div>'+det
    +'<div class="link-row">'
      +'<a class="link-btn'+(kp.kind==='ai'?' ghost':'')+'" href="'+kp.url+'" target="_blank">'+kpLabel+'</a>'
    +'</div>';
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

// ==================== TOOLTIP ====================
function showTT(e,id){
  const n=findNode(treeData,id);if(!n)return;
  const tt=document.getElementById('tooltip');
  const leafDetail=n.isNet?(n.note||'来自个人知识网络的课程知识点'):(n.detail?n.detail.join(' · '):'');
  const kpTT=kpTargetFor(n);
  const jumpHint=kpTT.kind==='ai'
    ? '<div class="tt-jump">🤖 站内暂无这个知识点 → 点右上角图标去 AI 问答提问</div>'
    : '<div class="tt-jump">🧭 点右上角图标 → 直达'+(kpTT.kind==='section'?'该篇教材':'对应知识点')+'</div>';
  const isLeaf=!n.children||n.children.length===0;
  if(isLeaf){
    tt.innerHTML='<div class="tt-title">'+n.label+'</div>'
      +'<div class="tt-desc">'+(leafDetail?leafDetail+' · ':'')+'点击查看详情，弹窗内可直达知识点</div>'+jumpHint;
    tt.style.display='block';tt.style.left=(e.clientX+16)+'px';tt.style.top=(e.clientY-12)+'px';
  }else if(n.desc){
    tt.innerHTML='<div class="tt-title">'+n.label+'</div><div class="tt-desc">'+n.desc+' · 点击展开</div>'+jumpHint;
    tt.style.display='block';tt.style.left=(e.clientX+16)+'px';tt.style.top=(e.clientY-12)+'px';
  }else{
    tt.innerHTML='<div class="tt-title">'+n.label+'</div>'+jumpHint;
    tt.style.display='block';tt.style.left=(e.clientX+16)+'px';tt.style.top=(e.clientY-12)+'px';
  }
}
function hideTT(){document.getElementById('tooltip').style.display='none'}

// ==================== CONTROLS ====================
function expandAll(){(function add(n){expanded.add(n.id);if(n.children)n.children.forEach(add);})(treeData);rebuild();}
function collapseToLv(lv){expanded.clear();expanded.add('root');(function add(n,l){if(l<=lv){expanded.add(n.id);if(n.children)n.children.forEach(function(c){add(c,l+1);});}})(treeData,0);rebuild();}
function resetView(){camTheta=-0.72;camPhi=1.12;autoSpin=true;expanded.clear();expanded.add('root');treeData.children.forEach(function(c){expanded.add(c.id);});rebuild();}

// ==================== 主循环 ====================
function tick(){
  requestAnimationFrame(tick);
  if(autoSpin&&!dragging){ camTheta+=0.0018; updateCamera(); }   // 缓慢自转，能看清这是一棵立体的树
  renderer.render(scene,camera);
  projectLabels();
}
window.addEventListener('resize', function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ==================== INIT ====================
buildTree();
fitCamera();
tick();
</script>
