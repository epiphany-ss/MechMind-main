<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的薄弱点 - 理论力学研究平台</title><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:"Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#7f1d1d,#dc2626);color:#fff;padding:28px max(20px,calc((100% - 980px)/2));display:flex;justify-content:space-between}.head h1{margin:0}.head a{color:#fff;text-decoration:none}.wrap{max-width:980px;margin:24px auto;padding:0 16px}.weak{background:#fff;border:1px solid #fecaca;border-left:5px solid #dc2626;border-radius:12px;padding:20px;margin-bottom:16px}.weak h2{margin:0 0 8px;font-size:1.1rem}.meta{color:#64748b;font-size:.85em;line-height:1.7}.btn{border:0;border-radius:7px;padding:9px 13px;margin:10px 8px 0 0;cursor:pointer}.yes{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}.empty{background:#fff;padding:40px;text-align:center;color:#64748b;border-radius:12px}</style></head><body><header class="head"><div><h1>⚠️ 我的薄弱点</h1><p>查看诊断依据并反馈判断是否准确</p></div><a href="personal_knowledge.html?v=20260826b">返回知识网络 →</a></header><main class="wrap" id="list"></main><script src="js/learning-memory-api.js"></script><script>
const user=(()=>{try{return JSON.parse(localStorage.getItem('current_user')||'null')||{}}catch(e){return{}}})();let items=[];function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('list').innerHTML=items.length?items.map(w=>`<article class="weak"><h2>待验证薄弱点</h2><div class="meta">判断等级：${esc(w.level)} · 用户反馈：${esc(w.user_feedback||'unknown')}</div><p>${esc(w.reasons||'暂无判断理由')}</p><div class="meta">证据 ID：${esc((w.evidence_ids||[]).join(', ')||'暂无')}</div><button class="btn yes" onclick="feedback('${w.id}','accurate')">判断准确</button><button class="btn no" onclick="feedback('${w.id}','inaccurate')">判断不准确</button></article>`).join(''):'<div class="empty">暂时没有薄弱点记录。完成一次学习整理后，系统会生成待验证判断。</div>'}async function feedback(id,value){try{const r=await LearningMemoryAPI.feedbackWeakness(user,id,value);Object.assign(items.find(x=>x.id===id),r.weakness);render()}catch(e){alert(e.message)}}async function init(){try{const r=await LearningMemoryAPI.listWeaknesses(user);items=r.weaknesses||[];render()}catch(e){document.getElementById('list').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}init();</script></body></html>
