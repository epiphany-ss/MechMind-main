<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#163a63}
      .h{font-size:22px;font-weight:700;fill:#0a4d95}
      .m{font-size:18px;font-weight:700}
      .s{font-size:15px}
      .xs{font-size:13px}
      .b{fill:#fff;stroke:#2a67b2;stroke-width:2}
      .bb{fill:#eef6ff;stroke:#2a67b2;stroke-width:2}
      .rb{fill:#fff6f6;stroke:#d64545;stroke-width:2}
      .gb{fill:#f2fbf2;stroke:#2f8f4e;stroke-width:2}
      .line{stroke:#2a67b2;stroke-width:2.5;fill:none}
      .dline{stroke:#d64545;stroke-width:2.5;stroke-dasharray:8 6;fill:none}
      .arr{stroke:#e53935;stroke-width:3.5;fill:none;marker-end:url(#arrowR)}
      .arrb{stroke:#2a67b2;stroke-width:3;fill:none;marker-end:url(#arrowB)}
    </style>
    <defs>
      <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#e53935"/></marker>
      <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#2a67b2"/></marker>
    </defs>
    <rect x="1" y="1" width="718" height="428" rx="18" ry="18" fill="#fbfdff" stroke="#c6dbef" stroke-width="2"/>
    
<text x="40" y="48" class="t h">静力学公理的知识位置</text>
<rect x="280" y="72" width="170" height="54" rx="14" class="bb"/><text x="365" y="106" text-anchor="middle" class="t m">静力学公理</text>
<rect x="60" y="180" width="150" height="54" rx="14" class="b"/><text x="135" y="214" text-anchor="middle" class="t m">推论</text>
<rect x="285" y="180" width="150" height="54" rx="14" class="b"/><text x="360" y="214" text-anchor="middle" class="t m">方法</text>
<rect x="510" y="180" width="150" height="54" rx="14" class="b"/><text x="585" y="214" text-anchor="middle" class="t m">应用</text>
<line x1="335" y1="126" x2="170" y2="180" class="line"/><line x1="365" y1="126" x2="360" y2="180" class="line"/><line x1="395" y1="126" x2="550" y2="180" class="line"/>
<text x="52" y="282" class="t s">平衡条件、二力构件、</text><text x="52" y="308" class="t s">三力汇交等常用结论</text>
<text x="260" y="282" class="t s">等效变换、受力图、</text><text x="260" y="308" class="t s">合成分解、求矩</text>
<text x="480" y="282" class="t s">支座反力、构件受力、</text><text x="480" y="308" class="t s">力系简化、工程分析</text>
<rect x="40" y="338" width="640" height="58" rx="14" class="gb"/><text x="360" y="374" text-anchor="middle" class="t s">记忆方式：公理不是孤立结论，而是后续一切静力学方法的出发点</text>

    </svg>