<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17385f}
.h{font-size:22px;font-weight:700;fill:#0a4d95}
.s{font-size:16px}
.xs{font-size:14px}
.box{fill:#fbfdff;stroke:#c7dcef;stroke-width:2}
.blue{fill:#eef6ff;stroke:#2d6fb7;stroke-width:2}
.green{fill:#f3fbf5;stroke:#3a9b5d;stroke-width:2}
.warn{fill:#fff8f2;stroke:#e8b36f;stroke-width:2}
.line{stroke:#2d6fb7;stroke-width:3;fill:none}
.dash{stroke:#8aaed3;stroke-width:2.4;stroke-dasharray:7 5;fill:none}
.arrR{stroke:#d94141;stroke-width:4;fill:none;marker-end:url(#ar)}
.arrB{stroke:#2d6fb7;stroke-width:4;fill:none;marker-end:url(#ab)}
</style>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#d94141"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2d6fb7"/></marker>
</defs>
<rect x="1" y="1" width="758" height="418" rx="16" fill="#fff" stroke="#d6e5f3" stroke-width="2"/>

<text x="32" y="42" class="t h">第1页拓展：力的三要素如何进入解题</text>
<rect x="70" y="95" width="150" height="58" rx="14" class="blue"/><text x="145" y="130" text-anchor="middle" class="t s">大小 F</text>
<rect x="305" y="95" width="150" height="58" rx="14" class="blue"/><text x="380" y="130" text-anchor="middle" class="t s">方向 θ</text>
<rect x="540" y="95" width="150" height="58" rx="14" class="blue"/><text x="615" y="130" text-anchor="middle" class="t s">作用点 A</text>
<line x1="145" y1="153" x2="250" y2="220" class="line"/><line x1="380" y1="153" x2="380" y2="220" class="line"/><line x1="615" y1="153" x2="510" y2="220" class="line"/>
<rect x="250" y="220" width="260" height="70" rx="16" class="green"/><text x="380" y="260" text-anchor="middle" class="t s">受力图与平衡方程</text>
<rect x="85" y="325" width="590" height="48" rx="12" class="warn"/><text x="105" y="355" class="t xs">解题技巧：每画一个力，都要问“大小已知吗？方向清楚吗？作用点在哪里？”</text>

</svg>