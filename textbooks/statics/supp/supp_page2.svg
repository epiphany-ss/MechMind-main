<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17385f}
.h{font-size:22px;font-weight:700;fill:#0a4d95}
.s{font-size:16px}
.xs{font-size:14px}
.box{fill:#fbfdff;stroke:#c7dcef;stroke-width:2}
.blue{fill:#eef6ff;stroke:#2d6fb7;stroke-width:2}
.green{fill:#f3fbf5;stroke:#3a9b5d;stroke-width:2}
.warn{fill:#fff8f2;stroke:#e8b36f;stroke-width:2}
.line{stroke:#2d6fb7;stroke-width:3;fill:none}
.dash{stroke:#8aaed3;stroke-width:2.4;stroke-dasharray:7 5;fill:none}
.arrR{stroke:#d94141;stroke-width:4;fill:none;marker-end:url(#ar)}
.arrB{stroke:#2d6fb7;stroke-width:4;fill:none;marker-end:url(#ab)}
</style>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#d94141"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2d6fb7"/></marker>
</defs>
<rect x="1" y="1" width="758" height="418" rx="16" fill="#fff" stroke="#d6e5f3" stroke-width="2"/>

<text x="32" y="42" class="t h">第2页拓展：模型选择流程</text>
<rect x="70" y="90" width="180" height="62" rx="14" class="blue"/><text x="160" y="126" text-anchor="middle" class="t s">是否关心尺寸？</text>
<rect x="300" y="90" width="180" height="62" rx="14" class="blue"/><text x="390" y="126" text-anchor="middle" class="t s">是否关心转动？</text>
<rect x="530" y="90" width="180" height="62" rx="14" class="blue"/><text x="620" y="126" text-anchor="middle" class="t s">是否关心变形？</text>
<rect x="75" y="225" width="150" height="58" rx="14" class="green"/><text x="150" y="260" text-anchor="middle" class="t s">质点模型</text>
<rect x="305" y="225" width="150" height="58" rx="14" class="green"/><text x="380" y="260" text-anchor="middle" class="t s">刚体模型</text>
<rect x="535" y="225" width="150" height="58" rx="14" class="green"/><text x="610" y="260" text-anchor="middle" class="t s">变形体模型</text>
<line x1="160" y1="152" x2="150" y2="225" class="line"/><line x1="390" y1="152" x2="380" y2="225" class="line"/><line x1="620" y1="152" x2="610" y2="225" class="line"/>
<rect x="80" y="330" width="600" height="46" rx="12" class="warn"/><text x="100" y="358" class="t xs">课外扩展：材料力学、结构力学会进一步研究“变形不能忽略”的情况。</text>

</svg>