<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="760" viewBox="0 0 1055 760">
    <style>
      .t{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill:#163a63}
      .h{font-size:22px;font-weight:700;fill:#0a4d95}
      .m{font-size:18px;font-weight:700}
      .s{font-size:15px}
      .xs{font-size:13px}
      .b{fill:#fff;stroke:#2a67b2;stroke-width:2}
      .bb{fill:#eef6ff;stroke:#2a67b2;stroke-width:2}
      .rb{fill:#fff6f6;stroke:#d64545;stroke-width:2}
      .gb{fill:#f2fbf2;stroke:#2f8f4e;stroke-width:2}
      .line{stroke:#2a67b2;stroke-width:2.5;fill:none}
      .dline{stroke:#d64545;stroke-width:2.5;stroke-dasharray:8 6;fill:none}
      .arr{stroke:#e53935;stroke-width:3.5;fill:none;marker-end:url(#arrowR)}
      .arrb{stroke:#2a67b2;stroke-width:3;fill:none;marker-end:url(#arrowB)}
    </style>
    <defs>
      <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#e53935"/></marker>
      <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#2a67b2"/></marker>
    </defs>
    <rect x="1" y="1" width="1053" height="758" rx="18" ry="18" fill="#fbfdff" stroke="#c6dbef" stroke-width="2"/>
    
<rect x="20" y="18" width="1015" height="60" rx="16" class="bb"/>
<text x="508" y="56" text-anchor="middle" class="t h">第7页｜静力学公理</text>
<rect x="400" y="120" width="260" height="78" rx="18" class="bb"/>
<text x="530" y="167" text-anchor="middle" class="t h">静力学公理</text>
<rect x="75" y="110" width="220" height="72" rx="16" class="b"/>
<text x="185" y="153" text-anchor="middle" class="t m">二力平衡公理</text>
<line x1="295" y1="146" x2="400" y2="156" class="line"/>
<rect x="760" y="110" width="220" height="72" rx="16" class="b"/>
<text x="870" y="145" text-anchor="middle" class="t m">加减平衡力系公理</text>
<text x="870" y="166" text-anchor="middle" class="t xs">（等效替换的根基）</text>
<line x1="760" y1="146" x2="660" y2="156" class="line"/>
<rect x="120" y="255" width="250" height="80" rx="16" class="b"/>
<text x="245" y="299" text-anchor="middle" class="t m">力的平行四边形法则</text>
<line x1="370" y1="270" x2="455" y2="198" class="line"/>
<rect x="690" y="255" width="250" height="80" rx="16" class="b"/>
<text x="815" y="299" text-anchor="middle" class="t m">作用与反作用公理</text>
<line x1="690" y1="270" x2="605" y2="198" class="line"/>
<rect x="120" y="390" width="810" height="96" rx="18" class="gb"/>
<text x="525" y="425" text-anchor="middle" class="t h">这些公理如何服务解题？</text>
<text x="150" y="458" class="t s">• 判断平衡条件：二力构件、三力构件、支座反力</text>
<text x="150" y="486" class="t s">• 进行等效变换：加减平衡力系 → 力系简化、受力图整理</text>
<text x="555" y="458" class="t s">• 做力的合成分解：平行四边形法则</text>
<text x="555" y="486" class="t s">• 区分不同物体间相互作用：作用与反作用公理</text>
<rect x="70" y="540" width="280" height="150" rx="18" class="rb"/>
<text x="210" y="578" text-anchor="middle" class="t h">易混提醒</text>
<text x="92" y="610" class="t s">1. 作用与反作用力不平衡，</text>
<text x="92" y="636" class="t s">   因为它们作用在不同物体上。</text>
<text x="92" y="662" class="t s">2. 二力平衡必须满足共线。</text>
<rect x="400" y="540" width="580" height="150" rx="18" class="bb"/>
<text x="690" y="578" text-anchor="middle" class="t h">与后续知识的连接</text>
<text x="430" y="610" class="t s">静力学公理 → 力系等效 → 力的平移定理 → 力系简化</text>
<text x="430" y="642" class="t s">静力学公理 → 受力图 → 平衡方程 → 约束反力求解</text>
<text x="430" y="674" class="t s">静力学公理 → 合力分解 → 力矩与力偶 → 平面一般力系</text>
<text x="527" y="745" text-anchor="middle" class="t h">第7页 / 扩展专题</text>

    </svg>