<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330">
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1d3d61}
.h{font-size:22px;font-weight:700;fill:#0a4d95}
.s{font-size:18px}
.xs{font-size:15px}
.line{stroke:#2d6fb7;stroke-width:3;fill:none}
.dash{stroke:#8aaed3;stroke-width:2.5;stroke-dasharray:7 6;fill:none}
.arrR{stroke:#d94141;stroke-width:4;fill:none;marker-end:url(#ar)}
.arrB{stroke:#2d6fb7;stroke-width:4;fill:none;marker-end:url(#ab)}
.box{fill:#fafdff;stroke:#c9dff1;stroke-width:2}
.note{fill:#eef6ff;stroke:#c9dff1;stroke-width:1.5}
</style>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#d94141"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2d6fb7"/></marker>
</defs>
<rect x="1" y="1" width="758" height="328" rx="16" ry="16" fill="#ffffff" stroke="#d7e6f3" stroke-width="2"/>

<text x="28" y="38" class="t h">题图：两个互相垂直的共点力</text>
<circle cx="180" cy="230" r="5" fill="#1d3d61"/>
<line x1="180" y1="230" x2="180" y2="80" class="arrB"/>
<line x1="180" y1="230" x2="330" y2="230" class="arrR"/>
<path d="M180 200 L210 200 L210 230" class="dash"/>
<text x="192" y="78" class="t s">4 N</text>
<text x="340" y="236" class="t s">3 N</text>
<line x1="180" y1="230" x2="330" y2="80" class="arrR"/>
<text x="342" y="84" class="t s">R = ?</text>
<rect x="400" y="100" width="300" height="150" rx="12" class="note"/>
<text x="420" y="135" class="t s">已知：</text>
<text x="420" y="170" class="t xs">水平力 = 3 N，竖直力 = 4 N</text>
<text x="420" y="200" class="t xs">两力互相垂直，可用勾股定理求合力大小</text>
<text x="420" y="230" class="t xs">R = √(3² + 4²)</text>

</svg>