<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1d3d61}
.h{font-size:22px;font-weight:700;fill:#0a4d95}
.s{font-size:18px}
.xs{font-size:15px}
.line{stroke:#2d6fb7;stroke-width:3;fill:none}
.dash{stroke:#8aaed3;stroke-width:2.5;stroke-dasharray:7 6;fill:none}
.arrR{stroke:#d94141;stroke-width:4;fill:none;marker-end:url(#ar)}
.arrB{stroke:#2d6fb7;stroke-width:4;fill:none;marker-end:url(#ab)}
.box{fill:#fafdff;stroke:#c9dff1;stroke-width:2}
.note{fill:#eef6ff;stroke:#c9dff1;stroke-width:1.5}
</style>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#d94141"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2d6fb7"/></marker>
</defs>
<rect x="1" y="1" width="758" height="318" rx="16" ry="16" fill="#ffffff" stroke="#d7e6f3" stroke-width="2"/>

<text x="28" y="38" class="t h">题图：水平力平移到 O 点</text>
<circle cx="150" cy="220" r="5" fill="#1d3d61"/><text x="128" y="244" class="t s">O</text>
<line x1="320" y1="110" x2="560" y2="110" class="arrR"/>
<text x="570" y="116" class="t s">F = 100 N</text>
<line x1="150" y1="220" x2="320" y2="220" class="dash"/>
<line x1="320" y1="220" x2="320" y2="110" class="dash"/>
<text x="340" y="175" class="t s">d = 0.2 m</text>
<rect x="430" y="175" width="240" height="90" rx="12" class="note"/>
<text x="448" y="208" class="t xs">求：附加力偶矩大小</text>
<text x="448" y="238" class="t xs">Mₒ = Fd = 100 × 0.2</text>

</svg>