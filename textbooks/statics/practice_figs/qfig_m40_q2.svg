<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340">
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1d3d61}
.h{font-size:22px;font-weight:700;fill:#0a4d95}
.s{font-size:18px}
.xs{font-size:15px}
.line{stroke:#2d6fb7;stroke-width:3;fill:none}
.dash{stroke:#8aaed3;stroke-width:2.5;stroke-dasharray:7 6;fill:none}
.arrR{stroke:#d94141;stroke-width:4;fill:none;marker-end:url(#ar)}
.arrB{stroke:#2d6fb7;stroke-width:4;fill:none;marker-end:url(#ab)}
.box{fill:#fafdff;stroke:#c9dff1;stroke-width:2}
.note{fill:#eef6ff;stroke:#c9dff1;stroke-width:1.5}
</style>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#d94141"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2d6fb7"/></marker>
</defs>
<rect x="1" y="1" width="758" height="338" rx="16" ry="16" fill="#ffffff" stroke="#d7e6f3" stroke-width="2"/>

<text x="28" y="38" class="t h">题图：竖直向下的力平移到 O 点</text>
<circle cx="180" cy="235" r="5" fill="#1d3d61"/><text x="158" y="260" class="t s">O</text>
<line x1="430" y1="95" x2="430" y2="240" class="arrR"/>
<text x="445" y="170" class="t s">F = 80 N</text>
<text x="445" y="195" class="t xs">竖直向下</text>
<line x1="180" y1="235" x2="430" y2="235" class="dash"/>
<text x="280" y="225" class="t s">0.5 m</text>
<path d="M260 150 A40 40 0 1 1 259 149" class="arrB"/>
<text x="300" y="150" class="t xs">判断对 O 的转向</text>
<rect x="470" y="235" width="220" height="60" rx="12" class="note"/>
<text x="488" y="271" class="t xs">等效系统：O 点处的力 + 附加力偶</text>

</svg>