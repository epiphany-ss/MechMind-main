<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1d3d61}
.h{font-size:22px;font-weight:700;fill:#0a4d95}
.s{font-size:18px}
.xs{font-size:15px}
.line{stroke:#2d6fb7;stroke-width:3;fill:none}
.dash{stroke:#8aaed3;stroke-width:2.5;stroke-dasharray:7 6;fill:none}
.arrR{stroke:#d94141;stroke-width:4;fill:none;marker-end:url(#ar)}
.arrB{stroke:#2d6fb7;stroke-width:4;fill:none;marker-end:url(#ab)}
.box{fill:#fafdff;stroke:#c9dff1;stroke-width:2}
.note{fill:#eef6ff;stroke:#c9dff1;stroke-width:1.5}
</style>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#d94141"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2d6fb7"/></marker>
</defs>
<rect x="1" y="1" width="758" height="358" rx="16" ry="16" fill="#ffffff" stroke="#d7e6f3" stroke-width="2"/>

<text x="28" y="38" class="t h">题图：平移到同一点后的主矢与主矩</text>
<circle cx="130" cy="180" r="5" fill="#1d3d61"/>
<text x="108" y="204" class="t s">O</text>
<line x1="130" y1="115" x2="260" y2="115" class="arrR"/>
<text x="270" y="121" class="t s">10 N</text>
<line x1="130" y1="205" x2="320" y2="205" class="arrR"/>
<text x="330" y="211" class="t s">20 N</text>
<path d="M400 120 A36 36 0 1 1 365 76" class="arrB"/>
<text x="420" y="110" class="t s">+3 N·m</text>
<path d="M400 250 A36 36 0 1 0 365 294" class="arrR"/>
<text x="420" y="280" class="t s">−5 N·m</text>
<rect x="500" y="120" width="210" height="145" rx="12" class="note"/>
<text x="518" y="154" class="t xs">主矢：R = 10 + 20 = 30 N</text>
<text x="518" y="188" class="t xs">主矩：Mₒ = 3 + (−5)</text>
<text x="518" y="222" class="t xs">方向按正负号代数相加</text>

</svg>