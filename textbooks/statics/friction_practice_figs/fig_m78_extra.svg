<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="900" height="340" fill="#f7fbff"/><rect x="110" y="170" width="210" height="90" rx="8" fill="#d8a15d" stroke="#8b5a2b" stroke-width="3"/><rect x="60" y="260" width="760" height="18" fill="#9aa8b3"/><text x="136" y="225" font-size="28" fill="#18324f">m = 10 kg</text><line x1="215" y1="120" x2="215" y2="168" stroke="#d61f2c" stroke-width="5"/><polygon points="215,170 205,150 225,150" fill="#d61f2c"/><text x="170" y="112" font-size="26" fill="#d61f2c">G = mg</text><line x1="215" y1="260" x2="215" y2="205" stroke="#1768c4" stroke-width="5"/><polygon points="215,205 205,225 225,225" fill="#1768c4"/><text x="237" y="229" font-size="26" fill="#1768c4">N</text><line x1="330" y1="215" x2="430" y2="215" stroke="#2b9348" stroke-width="5"/><polygon points="430,215 410,205 410,225" fill="#2b9348"/><text x="338" y="195" font-size="26" fill="#2b9348">P（外推力）</text><line x1="110" y1="215" x2="30" y2="215" stroke="#7b2cbf" stroke-width="5"/><polygon points="30,215 50,205 50,225" fill="#7b2cbf"/><text x="34" y="195" font-size="24" fill="#7b2cbf">f ≤ fmax</text><text x="520" y="90" font-size="30" fill="#0f3f77">题图：水平面上的静摩擦模型</text><text x="520" y="140" font-size="24" fill="#355270">当外推力逐渐增大时，静摩擦力随之增大，直到达到最大静摩擦力</text><text x="520" y="178" font-size="24" fill="#355270">最大值：fmax = μs N</text></svg>