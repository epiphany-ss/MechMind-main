<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><rect width="900" height="360" fill="#f7fbff"/><polygon points="120,280 420,280 420,100" fill="#d9dde2" stroke="#7a8695" stroke-width="3"/><rect x="250" y="178" width="90" height="56" rx="8" fill="#d8a15d" stroke="#8b5a2b" stroke-width="3" transform="rotate(-30 295 206)"/><line x1="293" y1="205" x2="348" y2="110" stroke="#d61f2c" stroke-width="5"/><polygon points="348,110 330,122 350,130" fill="#d61f2c"/><text x="352" y="112" font-size="25" fill="#d61f2c">G</text><line x1="310" y1="215" x2="240" y2="255" stroke="#7b2cbf" stroke-width="5"/><polygon points="240,255 260,255 250,238" fill="#7b2cbf"/><text x="164" y="272" font-size="24" fill="#7b2cbf">f 向上（阻碍下滑）</text><path d="M120 280 A55 55 0 0 1 167 252" fill="none" stroke="#1768c4" stroke-width="3"/><text x="178" y="250" font-size="24" fill="#1768c4">α = 30°</text><text x="520" y="80" font-size="30" fill="#0f3f77">题图：粗糙斜面上的滑动摩擦</text><text x="520" y="130" font-size="24" fill="#355270">已知 m = 2 kg，μ = 0.20，物块沿斜面下滑</text><text x="520" y="168" font-size="24" fill="#355270">法向力 N = mg cosα</text><text x="520" y="206" font-size="24" fill="#355270">滑动摩擦力 f = μN，方向沿斜面向上</text></svg>