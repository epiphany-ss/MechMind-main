<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><rect width="900" height="360" fill="#f7fbff"/><polygon points="120,290 430,290 430,150" fill="#dde3e8" stroke="#7a8695" stroke-width="3"/><rect x="247" y="204" width="88" height="54" rx="8" fill="#d8a15d" stroke="#8b5a2b" stroke-width="3" transform="rotate(-15 291 231)"/><line x1="292" y1="232" x2="350" y2="125" stroke="#d61f2c" stroke-width="5"/><polygon points="350,125 332,137 352,145" fill="#d61f2c"/><line x1="292" y1="232" x2="261" y2="116" stroke="#1768c4" stroke-width="5"/><polygon points="261,116 255,137 274,132" fill="#1768c4"/><text x="516" y="82" font-size="30" fill="#0f3f77">题图：摩擦角在临界平衡中的应用</text><text x="516" y="130" font-size="24" fill="#355270">斜面角 α = 15°，μ = 0.30，则摩擦角 φ = arctan μ ≈ 16.7°</text><text x="516" y="168" font-size="24" fill="#355270">因为 α &lt; φ，故物块不会自行下滑，可处于静止平衡</text><text x="516" y="206" font-size="24" fill="#355270">临界判据常写成：α = φ 或 tanα = μ</text></svg>