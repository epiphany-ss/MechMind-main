<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><rect width="900" height="360" fill="#f7fbff"/><line x1="80" y1="280" x2="440" y2="280" stroke="#9aa8b3" stroke-width="8"/><circle cx="245" cy="215" r="65" fill="#fff7ec" stroke="#8b5a2b" stroke-width="4"/><circle cx="245" cy="215" r="4" fill="#8b5a2b"/><line x1="245" y1="215" x2="345" y2="215" stroke="#2b9348" stroke-width="5"/><polygon points="345,215 325,205 325,225" fill="#2b9348"/><text x="352" y="220" font-size="24" fill="#2b9348">F</text><line x1="245" y1="150" x2="245" y2="92" stroke="#d61f2c" stroke-width="5"/><polygon points="245,92 235,112 255,112" fill="#d61f2c"/><text x="252" y="108" font-size="24" fill="#d61f2c">G</text><line x1="255" y1="280" x2="255" y2="225" stroke="#1768c4" stroke-width="5"/><polygon points="255,225 245,245 265,245" fill="#1768c4"/><text x="270" y="246" font-size="24" fill="#1768c4">N（偏移 e）</text><text x="515" y="82" font-size="30" fill="#0f3f77">题图：滚动摩阻计算模型</text><text x="515" y="130" font-size="24" fill="#355270">已知轮重 N = 200 N，滚阻系数 e = 5 mm，半径 r = 0.25 m</text><text x="515" y="168" font-size="24" fill="#355270">阻力矩 M_r = N e = 200×0.005 = 1 N·m</text><text x="515" y="206" font-size="24" fill="#355270">若水平拉力作用于轮心，匀速滚动条件：F r = M_r，故 F = 4 N</text></svg>