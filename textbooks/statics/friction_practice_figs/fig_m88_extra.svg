<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360"><rect width="900" height="360" fill="#f7fbff"/><polygon points="110,290 420,290 420,145" fill="#dde3e8" stroke="#7a8695" stroke-width="3"/><rect x="235" y="198" width="98" height="58" rx="8" fill="#d8a15d" stroke="#8b5a2b" stroke-width="3" transform="rotate(-12 284 227)"/><text x="510" y="82" font-size="30" fill="#0f3f77">题图：斜面自锁判定</text><text x="510" y="130" font-size="24" fill="#355270">已知 α = 12°，μ = 0.25，则 φ = arctan0.25 ≈ 14.0°</text><text x="510" y="168" font-size="24" fill="#355270">由于 α &lt; φ，故满足自锁条件，物块不会自动下滑</text><text x="510" y="206" font-size="24" fill="#355270">常用记忆：自锁 ⇔ tanα ≤ μ</text></svg>