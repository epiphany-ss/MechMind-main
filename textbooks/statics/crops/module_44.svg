<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#1d3d61}
.h{font-size:22px;font-weight:700;fill:#0a4d95}
.m{font-size:18px;font-weight:700}
.s{font-size:16px}
.xs{font-size:14px}
.line{stroke:#2d6fb7;stroke-width:3;fill:none}
.arrR{stroke:#d94141;stroke-width:3.8;fill:none;marker-end:url(#ar)}
.arrB{stroke:#2d6fb7;stroke-width:3.8;fill:none;marker-end:url(#ab)}
.dash{stroke:#8aaed3;stroke-width:2.2;stroke-dasharray:7 5;fill:none}
.box{fill:#fafdff;stroke:#c9dff1;stroke-width:2}
.note{fill:#eef6ff;stroke:#c9dff1;stroke-width:1.5}
.warn{fill:#fff8f2;stroke:#efc28d;stroke-width:1.5}
</style>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#d94141"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2d6fb7"/></marker>
</defs>
<rect x="1" y="1" width="718" height="428" rx="16" ry="16" fill="#ffffff" stroke="#d7e6f3" stroke-width="2"/>

<text x="40" y="46" class="t h">平移定理与力系简化的联系</text>
<rect x="70" y="94" width="120" height="54" rx="12" class="box"/><text x="130" y="128" text-anchor="middle" class="t xs">分散的多个力</text>
<rect x="290" y="94" width="140" height="54" rx="12" class="box"/><text x="360" y="128" text-anchor="middle" class="t xs">平移到参考点 O</text>
<rect x="530" y="94" width="120" height="54" rx="12" class="box"/><text x="590" y="128" text-anchor="middle" class="t xs">得到 R 与 Mₒ</text>
<line x1="190" y1="121" x2="290" y2="121" class="line"/><line x1="430" y1="121" x2="530" y2="121" class="line"/>
<text x="110" y="215" class="t xs">F₁，F₂，F₃...</text>
<text x="320" y="215" class="t xs">每个力都变成：</text>
<text x="320" y="240" class="t xs">O 点处同向等值力 + 附加力偶</text>
<rect x="90" y="284" width="560" height="84" rx="14" class="note"/>
<text x="108" y="315" class="t xs">当你会做“单个力的平移”之后，就可以进一步处理“多个力的统一平移”，</text>
<text x="108" y="341" class="t xs">这正是平面一般力系简化的入口。</text>

</svg>