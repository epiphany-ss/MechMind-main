<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 注意：本页**不挂** js/auth.js —— 它是给所有访客看的公开页面，
     不经过登录闸门（auth.js 只放行 account.html，其余页面未登录一律跳登录页）。
     编辑入口靠 localStorage 里的 current_user 判断角色，不需要 auth.js。 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台内容总览 - 长沙理工大学理论力学研究平台</title>
<style>
:root{
  --primary:#1a56db; --primary-dark:#0d3b9e; --primary-light:#e8f0fe;
  --accent:#f0a030; --bg:#f5f7fa; --card-bg:#ffffff;
  --text:#2c3e50; --text-light:#5a6c7d; --text-lighter:#8899aa;
  --border:#e2e8f0; --shadow:0 2px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,.12);
  --radius:12px; --radius-sm:8px; --transition:.3s cubic-bezier(.4,0,.2,1);
  --nav-height:64px; --max-width:1320px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; overflow-x:hidden;
}

/* ===== 顶部条 ===== */
.back-home{
  position:fixed; top:18px; left:22px; z-index:1000;
  padding:9px 18px; border-radius:22px; border:1px solid var(--border);
  background:rgba(255,255,255,.95); backdrop-filter:blur(10px);
  color:var(--text); text-decoration:none; font-size:.86em; font-weight:600;
  box-shadow:var(--shadow); transition:var(--transition);
}
.back-home:hover{background:var(--primary); color:#fff; border-color:var(--primary); transform:translateY(-1px)}

/* ===== Hero ===== */
.hero{
  background:linear-gradient(135deg,#0d3b9e 0%,#1a56db 45%,#3b82f6 100%);
  color:#fff; padding:96px 32px 72px; text-align:center; position:relative; overflow:hidden;
}
.hero::after{
  content:''; position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 18% 30%,rgba(255,255,255,.14) 0,transparent 42%),
    radial-gradient(circle at 82% 72%,rgba(240,160,48,.20) 0,transparent 46%);
  pointer-events:none;
}
.hero-inner{position:relative; z-index:1; max-width:900px; margin:0 auto}
.hero-tag{
  display:inline-block; padding:6px 18px; border-radius:20px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3);
  font-size:.76em; letter-spacing:2.5px; font-weight:700; margin-bottom:22px;
}
.hero h1{font-size:2.6em; font-weight:800; letter-spacing:1px; margin-bottom:16px; line-height:1.25}
.hero p{font-size:1.02em; opacity:.9; max-width:660px; margin:0 auto; line-height:1.85}
.hero-meta{margin-top:30px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap}
.hero-meta span{
  padding:7px 16px; border-radius:8px; font-size:.8em;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
}

/* ===== 容器 ===== */
.wrap{max-width:var(--max-width); margin:0 auto; padding:0 32px}
section{padding:62px 0}
.sec-head{margin-bottom:34px}
.sec-head .kicker{
  font-size:.76em; font-weight:800; letter-spacing:2.4px; color:var(--primary);
  text-transform:uppercase; margin-bottom:8px;
}
.sec-head h2{font-size:1.75em; font-weight:800; letter-spacing:.5px; display:flex; align-items:center; gap:12px}
.sec-head h2 .ico{
  width:42px; height:42px; border-radius:11px; display:inline-flex;
  align-items:center; justify-content:center; font-size:1.05em;
  background:var(--primary-light); flex:none;
}
.sec-head p{color:var(--text-light); font-size:.92em; margin-top:10px; max-width:820px}

/* ===== KPI 大数字 ===== */
.kpi-grid{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:20px; margin-top:-46px; position:relative; z-index:5;
}
.kpi{
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:26px 22px; text-align:center; box-shadow:var(--shadow-lg);
  transition:var(--transition); position:relative; overflow:hidden;
}
.kpi::before{content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--k,var(--primary))}
.kpi:hover{transform:translateY(-5px)}
.kpi .n{font-size:2.5em; font-weight:800; color:var(--k,var(--primary)); line-height:1.05; letter-spacing:-1px}
/* 文字型（不是数字）的 KPI：字号自适应 + 不换行，避免长句撑破 4 列网格 */
.kpi .n.is-text{font-size:clamp(1em, 1.1vw + 0.7em, 1.55em); letter-spacing:0; white-space:nowrap; line-height:1.3}
/* 带能力标签的 KPI 格（AI 智能问答用）：一组小标签代替大数字。
   min-height 对齐其它格的 .n，保证同一行卡片高度不塌。 */
/* 高度对齐大数字 .n（2.5em × line-height 1.05 = 2.625em），
   这样 AI 那格的标题才能和同排其它卡对齐。用 min-height：标签加到 5 个以上时
   让它自然长高，而不是把内容裁掉。 */
.kpi .kc{
  display:grid; grid-template-columns:1fr 1fr; gap:5px 7px;
  min-height:2.625em; align-content:center;
}
.kpi .kc > span{
  font-size:.71em; font-weight:700; line-height:1;
  padding:3px 3px; border-radius:8px; text-align:center;
  background:#f1f5fb; color:var(--k,var(--primary));
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
/* 编辑模式下标签要能显示 ↑↓＋🗑 工具条，overflow:hidden 会把它裁掉 */
.editing .kpi .kc > span{overflow:visible}
.kpi .n small{font-size:.4em; font-weight:700; margin-left:3px; letter-spacing:0}
.kpi .l{font-size:.86em; color:var(--text-light); margin-top:10px; font-weight:600}
.kpi .s{font-size:.72em; color:var(--text-lighter); margin-top:5px}

/* ===== 卡片网格 ===== */
.grid{display:grid; gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(206px,1fr))}
.card{
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:24px; box-shadow:var(--shadow); transition:var(--transition);
  display:flex; flex-direction:column;   /* 让卡片底部的标签对齐 */
}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#cbd8ea}
.card h3{font-size:1.06em; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:9px}
.card .desc{font-size:.85em; color:var(--text-light); line-height:1.72; margin-bottom:16px; flex:1}
.card > .tag{align-self:flex-start}
.card .big{font-size:2em; font-weight:800; color:var(--primary); line-height:1.1}
.card .big small{font-size:.4em; font-weight:700; color:var(--text-light); margin-left:4px}

/* ===== 分布条 ===== */
.bars{display:flex; flex-direction:column; gap:13px; margin-top:6px}
.bar-row{display:flex; align-items:center; gap:12px; font-size:.84em}
.bar-row .name{width:88px; flex:none; color:var(--text-light); font-weight:600}
.bar-row .track{flex:1; height:9px; border-radius:6px; background:#eef2f7; overflow:hidden}
.bar-row .fill{display:block; height:100%; border-radius:6px; transition:width .8s cubic-bezier(.4,0,.2,1)}
.bar-row .val{width:74px; flex:none; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.bar-row .val em{font-style:normal; color:var(--text-lighter); font-weight:500; font-size:.9em}

/* ===== 胶囊标签 ===== */
.tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.tag{
  padding:5px 13px; border-radius:16px; font-size:.79em; font-weight:600;
  background:var(--primary-light); color:var(--primary-dark);
}
.tag.g{background:#e3f6ea; color:#166534}
.tag.o{background:#fdf0dc; color:#9a5b06}
.tag.p{background:#f3e8fd; color:#6b21a8}
.tag.r{background:#fde8ef; color:#9d174d}

/* ===== 清单表 ===== */
.tbl{width:100%; border-collapse:collapse; font-size:.85em; margin-top:4px}
.tbl th{
  text-align:left; padding:11px 14px; background:#f1f5fb; color:var(--text-light);
  font-weight:700; font-size:.9em; border-bottom:1px solid var(--border); white-space:nowrap;
}
.tbl th:first-child{border-radius:8px 0 0 0}
.tbl th:last-child{border-radius:0 8px 0 0}
.tbl td{padding:11px 14px; border-bottom:1px solid #eef2f7; vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .18s}
.tbl tbody tr:hover{background:#f8fafd}
.tbl a{color:var(--primary); text-decoration:none; font-weight:600}
.tbl a:hover{text-decoration:underline}
.tbl code{
  font-family:'SFMono-Regular',Consolas,monospace; font-size:.9em;
  background:#f1f5fb; padding:2px 7px; border-radius:5px; color:var(--text-light);
}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}

/* ===== 分组面板 ===== */
.panel{
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:26px; box-shadow:var(--shadow);
}
.panel > h3{
  font-size:1.1em; font-weight:800; margin-bottom:4px;
  display:flex; align-items:center; gap:9px;
}
.panel > .sub{font-size:.83em; color:var(--text-lighter); margin-bottom:20px}

/* ===== 闭环流程 ===== */
.flow{
  display:flex; flex-wrap:wrap; gap:12px; align-items:stretch; margin-top:6px;
}
.flow-step{
  flex:1 1 150px; background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:18px 16px; position:relative;
  box-shadow:var(--shadow); transition:var(--transition);
}
.flow-step:hover{transform:translateY(-3px); border-color:var(--primary)}
.flow-step .idx{
  width:26px; height:26px; border-radius:8px; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:.78em; font-weight:800;
  margin-bottom:10px;
}
.flow-step h4{font-size:.94em; font-weight:700; margin-bottom:6px}
.flow-step p{font-size:.79em; color:var(--text-light); line-height:1.65}
.flow-step.hot .idx{background:var(--accent)}
.flow-step.cool .idx{background:#16a34a}

/* ===== 运行方式 ===== */
.ports{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; margin-top:6px}
.port{
  background:#0f172a; color:#e2e8f0; border-radius:var(--radius);
  padding:22px 24px; box-shadow:var(--shadow-lg); border:1px solid #1e293b;
}
.port .pnum{font-size:1.5em; font-weight:800; color:#4cc9f0; font-family:'SFMono-Regular',Consolas,monospace}
.port .prole{font-size:.82em; color:#94a3b8; margin-top:4px; margin-bottom:14px}
.port ul{list-style:none; font-size:.82em; line-height:1.95; color:#cbd5e1}
.port ul li::before{content:'▸ '; color:#4cc9f0}

/* ===== 受保护提示 ===== */
.protect{
  background:linear-gradient(135deg,#fff7e6,#fef3c7);
  border:1px solid #fcd34d; border-left:5px solid var(--accent);
  border-radius:var(--radius); padding:20px 24px; margin-top:8px;
}
.protect h4{font-size:.98em; font-weight:800; color:#92400e; margin-bottom:7px}
.protect p{font-size:.85em; color:#78350f; line-height:1.8}

/* ===== 页脚 ===== */
footer{
  background:#0f172a; color:#94a3b8; padding:44px 32px 34px; margin-top:40px;
  text-align:center; font-size:.84em; line-height:2;
}
footer b{color:#e2e8f0}

/* ===== 响应式 ===== */
@media(max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .kpi-grid{grid-template-columns:1fr; gap:14px; margin-top:-30px}
  .hero{padding:82px 22px 60px}
  .hero h1{font-size:1.85em}
  .hero p{font-size:.92em}
  .wrap{padding:0 20px}
  section{padding:48px 0}
  .sec-head h2{font-size:1.35em}
  .bar-row .name{width:70px; font-size:.92em}
  .bar-row .val{width:62px}
  .back-home{top:12px; left:12px; padding:7px 14px; font-size:.8em}
  /* 表格较宽时允许面板内横向滚动，避免整页出现横向溢出 */
  .panel{overflow-x:auto}
  .tbl{font-size:.79em}
  .tbl th,.tbl td{padding:9px 10px}
  .tbl th{white-space:normal}
  .tbl code{word-break:break-all}
}

/* ===== 编辑模式（仅管理员可见） ===== */
.edit-toggle{
  position:fixed; right:22px; bottom:22px; z-index:1200;
  padding:11px 20px; border-radius:24px; border:none;
  background:var(--primary); color:#fff; font-size:.86em; font-weight:700;
  cursor:pointer; font-family:inherit; box-shadow:0 8px 26px rgba(26,86,219,.36);
  transition:var(--transition);
}
.edit-toggle[hidden]{display:none}
.edit-toggle:hover{background:var(--primary-dark); transform:translateY(-2px)}

.edit-bar{
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:1200;
  display:flex; gap:10px; align-items:center; padding:10px 16px; border-radius:30px;
  background:rgba(15,23,42,.95); backdrop-filter:blur(10px);
  box-shadow:0 10px 34px rgba(0,0,0,.3);
}
.edit-bar[hidden]{display:none}
.eb-state{color:#cbd5e1; font-size:.8em; font-weight:600; margin-right:4px; white-space:nowrap}
.eb-btn{
  padding:8px 16px; border-radius:18px; border:1px solid #334155; background:#1e293b;
  color:#e2e8f0; font-size:.8em; font-weight:600; cursor:pointer;
  font-family:inherit; transition:.18s;
}
.eb-btn:hover{background:#334155}
.eb-primary{background:var(--primary); border-color:var(--primary)}
.eb-primary:hover{background:var(--primary-dark)}
.eb-danger{color:#fca5a5; border-color:#7f1d1d}
.eb-danger:hover{background:#7f1d1d; color:#fff}

/* 可编辑字段的视觉提示 */
[contenteditable="true"]{
  outline:1px dashed rgba(26,86,219,.5); outline-offset:2px;
  border-radius:4px; cursor:text; transition:background .15s;
}
[contenteditable="true"]:hover{background:rgba(26,86,219,.07)}
[contenteditable="true"]:focus{outline:2px solid var(--primary); background:#fff}

/* 列表项工具条：悬停条目才出现 */
[data-list]{position:relative}
.etools{
  position:absolute; top:-10px; right:-8px; z-index:60;
  display:flex; gap:2px; padding:3px; border-radius:8px;
  background:rgba(15,23,42,.94); box-shadow:0 4px 14px rgba(0,0,0,.28);
  opacity:0; transition:opacity .15s;
}
[data-list]:hover > .etools{opacity:1}
.etools button{
  width:22px; height:22px; border:none; border-radius:5px; background:transparent;
  color:#cbd5e1; font-size:.72em; cursor:pointer; line-height:1; padding:0; font-family:inherit;
}
.etools button:hover{background:#334155; color:#fff}
.etools button.del:hover{background:#b91c1c; color:#fff}

/* .kpi 本来就 overflow:hidden（给顶部色条用），编辑时放开，否则工具条被裁掉 */
.editing .kpi{overflow:visible}
.cards-title{font-size:1.1em; font-weight:800; margin:34px 0 16px}

/* 提示条 */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px); z-index:1400;
  padding:12px 22px; border-radius:12px; background:#b91c1c; color:#fff;
  font-size:.85em; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.28);
  opacity:0; pointer-events:none; transition:.28s;
}
.toast.show{opacity:1; transform:translate(-50%,0)}
.toast.ok{background:#15803d}
</style>
</head>
<body>

<a class="back-home" href="index.html">← 返回主页</a>

<!-- 编辑模式下的浮动工具条（仅管理员可见） -->
<div id="editBar" class="edit-bar" hidden>
  <span class="eb-state" id="ebState">编辑模式</span>
  <button id="ebSave"   class="eb-btn eb-primary">💾 保存</button>
  <button id="ebCancel" class="eb-btn">取消</button>
  <button id="ebReset"  class="eb-btn eb-danger">恢复默认</button>
</div>

<!-- 管理员入口：进入编辑模式 -->
<button id="editToggle" class="edit-toggle" hidden>✏️ 编辑</button>

<!-- 页面内容全部由 js/site_stats_data.js + 渲染器生成 -->
<header class="hero" id="heroRoot"></header>

<div class="wrap"><div class="kpi-grid" id="kpiRoot"></div></div>

<div id="sectionsRoot"></div>

<footer id="footerRoot"></footer>

<div id="toast" class="toast"></div>

<script src="js/site_stats_data.js"></script>
<script>
/* ============================================================
   平台内容总览 · 渲染 + 编辑
   ------------------------------------------------------------
   · 展示：从 SITE_STATS_DEFAULT（或服务端已存内容）渲染整页
   · 编辑：管理员可改文字 / 增删条目 / 上下移动 / 恢复默认
   · 保存：POST /api/site-content → sdata/site_content.json（全站可见）
   · 服务端会校验 uid 是否为 admin，但站点没有登录态（无 cookie/token），
     所以这只是「防误改」的软闸门，不是安全边界。详见 修改记录.md。
   ============================================================ */
(function () {
  'use strict';

  var API = (typeof window.mmApi === 'function') ? window.mmApi('/api/site-content') : '/api/site-content';
  var DEFAULT = window.SITE_STATS_DEFAULT;

  var DATA = null;          // 当前渲染用的数据
  var editing = false;
  var dirty = false;

  var user = (function () {
    try { return JSON.parse(localStorage.getItem('current_user') || 'null') || {}; }
    catch (e) { return {}; }
  })();
  var UID = user.student_id || user.id || '';
  var IS_ADMIN = user.role === 'admin';

  /* ---------------- 小工具 ---------------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function path() { return Array.prototype.slice.call(arguments).filter(function (x) { return x !== undefined && x !== null && x !== ''; }).join('.'); }

  function getPath(obj, p) {
    return p.split('.').reduce(function (o, k) { return (o == null) ? o : o[k]; }, obj);
  }
  function setPath(obj, p, val) {
    var ks = p.split('.'), last = ks.pop();
    var t = ks.reduce(function (o, k) { return o[k]; }, obj);
    t[last] = val;
  }
  function parentList(obj, p) {
    var ks = p.split('.'), last = ks.pop();
    var t = ks.reduce(function (o, k) { return o[k]; }, obj);
    return { arr: t, key: last };
  }

  /* 编辑器绑定：文本走 textContent，html 走 innerHTML */
  function ep(p, mode) {
    if (!editing) return '';
    return ' data-p="' + esc(p) + '"' + (mode === 'html' ? ' data-html="1"' : '') + ' contenteditable="true" spellcheck="false"';
  }
  /* 列表项绑定：给它加上 ↑↓🗑＋ 工具条 */
  function el_(listPath, i) {
    if (!editing) return '';
    return ' data-list="' + esc(listPath) + '" data-i="' + i + '"';
  }
  function href(h) {
    // 编辑模式下禁用跳转，否则点一下文字就跑了
    return (!h || editing) ? '' : ' href="' + esc(h) + '"';
  }

  /* ---------------- 渲染器 ---------------- */

  function panelHead(b, bp) {
    var h = '';
    if (b.title != null) h += '<h3' + ep(path(bp, 'title')) + '>' + esc(b.title) + '</h3>';
    if (b.sub != null) h += '<div class="sub"' + ep(path(bp, 'sub')) + '>' + esc(b.sub) + '</div>';
    return h;
  }

  function rStats(b, bp) {
    var cols = b.cols || 4, h = '';
    var grid = '<div class="grid g' + cols + '" style="gap:14px">';
    b.items.forEach(function (it, i) {
      var ip = path(bp, 'items', i);
      grid += '<div class="card" style="padding:18px;text-align:center"' + el_(path(bp, 'items'), i) + '>'
            +   '<div class="big"' + ep(path(ip, 'v')) + '>' + esc(it.v) + '</div>'
            +   '<div class="desc" style="margin:5px 0 0"' + ep(path(ip, 'l')) + '>' + esc(it.l) + '</div>'
            + '</div>';
    });
    grid += '</div>';
    if (b.panel) return '<div class="panel">' + panelHead(b, bp) + grid + '</div>';
    return (b.title != null ? panelHead(b, bp) : '') + grid;
  }

  function rBars(b, bp) {
    var h = '<div class="grid g' + (b.cols || 2) + '">';
    (b.items || []).forEach(function (pn, pi) {
      var pp = path(bp, 'items', pi);
      var max = 1;
      (pn.rows || []).forEach(function (r) { max = Math.max(max, +r.value || 0); });
      h += '<div class="panel"' + el_(path(bp, 'items'), pi) + '>';
      h += '<h3' + ep(path(pp, 'title')) + '>' + esc(pn.title) + '</h3>';
      h += '<div class="sub"' + ep(path(pp, 'sub')) + '>' + esc(pn.sub) + '</div>';
      h += '<div class="bars">';
      (pn.rows || []).forEach(function (r, ri) {
        var rp = path(pp, 'rows', ri);
        var w = (100 * (+r.value || 0) / max).toFixed(1);
        var c = r.c || ['#1a56db', '#3b82f6'];
        h += '<div class="bar-row"' + el_(path(pp, 'rows'), ri) + '>'
           +   '<span class="name"' + ep(path(rp, 'name')) + '>' + esc(r.name) + '</span>'
           +   '<span class="track"><span class="fill" style="width:' + w + '%;background:linear-gradient(90deg,' + esc(c[0]) + ',' + esc(c[1]) + ')"></span></span>'
           +   '<span class="val"><span' + ep(path(rp, 'value')) + '>' + esc(r.value) + '</span> <em>' + esc(pn.unit || '') + '</em></span>'
           + '</div>';
      });
      h += '</div></div>';
    });
    return h + '</div>';
  }

  function rCards(b, bp) {
    var cols = b.cols || 4;
    var grid = '<div class="grid g' + cols + '"' + (b.panel ? ' style="gap:14px"' : '') + '>';
    (b.items || []).forEach(function (it, i) {
      var ip = path(bp, 'items', i);
      var tagMode = !!(it.href && it.tag);      // 标签是链接（配套模块那种）
      var cardMode = !!(it.href && !it.tag);    // 整张卡是链接（机构卡那种）
      var inner = '<h3>'
                + (it.icon != null ? '<span' + ep(path(ip, 'icon')) + '>' + esc(it.icon) + '</span> ' : '')
                + '<span' + ep(path(ip, 'title')) + '>' + esc(it.title) + '</span>'
                + '</h3>'
                + '<div class="desc"' + (b.panel ? ' style="margin-bottom:0"' : '') + ep(path(ip, 'desc')) + '>' + esc(it.desc) + '</div>';
      if (it.tag != null) {
        var tcls = 'tag' + (it.tone ? ' ' + it.tone : '');
        if (tagMode) inner += '<a class="' + tcls + '" style="text-decoration:none"' + href(it.href) + ep(path(ip, 'tag')) + '>' + esc(it.tag) + '</a>';
        else         inner += '<span class="' + tcls + '"' + ep(path(ip, 'tag')) + '>' + esc(it.tag) + '</span>';
      }
      var style = cardMode ? 'text-decoration:none;color:inherit' : '';
      if (b.panel) style += (style ? ';' : '') + 'margin-bottom:0';
      var open = cardMode ? '<a class="card" style="' + style + '"' + href(it.href) : '<div class="card" style="' + style + '"';
      var close = cardMode ? '</a>' : '</div>';
      // el_ 放在最外层，工具条绝对定位
      grid += open.replace(/^(<\w+)/, '$1' + el_(path(bp, 'items'), i)) + inner + close;
    });
    grid += '</div>';
    if (b.panel) return '<div class="panel">' + panelHead(b, bp) + grid + '</div>';
    return (b.title != null ? '<h3 class="cards-title"' + ep(path(bp, 'title')) + '>' + esc(b.title) + '</h3>' : '') + grid;
  }

  function rTags(b, bp) {
    var h = (b.title != null ? panelHead(b, bp) : '');
    h += '<div class="tags">';
    (b.items || []).forEach(function (it, i) {
      var ip = path(bp, 'items', i);
      var cls = 'tag' + (it.tone ? ' ' + it.tone : '');
      var st = it.style ? ' style="' + esc(it.style) + '"' : '';
      h += '<span class="' + cls + '"' + st + ep(path(ip, 'text')) + el_(path(bp, 'items'), i) + '>' + esc(it.text) + '</span>';
    });
    h += '</div>';
    return '<div class="panel">' + h + '</div>';
  }

  function rTable(t, tp) {
    var h = '';
    if (t.title != null) h += '<h3' + (tp ? ep(path(tp, 'title')) : '') + '>' + esc(t.title) + '</h3>';
    if (t.sub != null)   h += '<div class="sub"' + (tp ? ep(path(tp, 'sub')) : '') + '>' + esc(t.sub) + '</div>';
    h += '<table class="tbl"><thead><tr>';
    (t.head || []).forEach(function (c, i) {
      h += '<th' + (t.widths && t.widths[i] ? ' style="width:' + esc(t.widths[i]) + '"' : '') + ep(path(tp, 'head', i)) + '>' + esc(c) + '</th>';
    });
    h += '</tr></thead><tbody>';
    (t.rows || []).forEach(function (row, ri) {
      h += '<tr' + el_(path(tp, 'rows'), ri) + '>';
      row.forEach(function (cell, ci) {
        var cp = path(tp, 'rows', ri, ci);
        var inner = esc(cell.t);
        if (cell.code) inner = '<code>' + inner + '</code>';
        if (cell.bold) inner = '<b>' + inner + '</b>';
        if (cell.href) inner = '<a' + href(cell.href) + ep(path(cp, 't')) + '>' + esc(cell.t) + '</a>';
        else inner = inner.replace(esc(cell.t), '<span' + ep(path(cp, 't')) + '>' + esc(cell.t) + '</span>');
        h += '<td>' + inner + '</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table>';
  }

  function rTableBlock(b, bp) {
    var tables = b.items || [b];
    var h = '';
    tables.forEach(function (t, ti) {
      var tp = b.items ? path(bp, 'items', ti) : bp;
      h += rTable(t, tp);
    });
    if (b.panel) return '<div class="panel scroll-x">' + h + '</div>';
    return '<div class="scroll-x">' + h + '</div>';
  }

  function rSteps(b, bp) {
    var h = '<div class="flow">';
    (b.items || []).forEach(function (it, i) {
      var ip = path(bp, 'items', i);
      h += '<div class="flow-step' + (it.tone ? ' ' + it.tone : '') + '"' + el_(path(bp, 'items'), i) + '>'
         +   '<div class="idx"' + ep(path(ip, 'no')) + '>' + esc(it.no) + '</div>'
         +   '<h4' + ep(path(ip, 'title')) + '>' + esc(it.title) + '</h4>'
         +   '<p' + ep(path(ip, 'desc')) + '>' + esc(it.desc) + '</p>'
         + '</div>';
    });
    return h + '</div>';
  }

  function rPorts(b, bp) {
    var h = '<div class="ports">';
    (b.items || []).forEach(function (it, i) {
      var ip = path(bp, 'items', i);
      var green = it.tone === 'green';
      h += '<div class="port"' + (green ? ' style="background:#132f1f;border-color:#1c4a30"' : '') + el_(path(bp, 'items'), i) + '>'
         +   '<div class="pnum"' + (green ? ' style="color:#4ade80"' : '') + ep(path(ip, 'num')) + '>' + esc(it.num) + '</div>'
         +   '<div class="prole"' + (green ? ' style="color:#86efac"' : '') + ep(path(ip, 'role')) + '>' + esc(it.role) + '</div>'
         +   '<ul' + (green ? ' style="color:#bbf7d0"' : '') + '>';
      (it.lines || []).forEach(function (ln, li) {
        h += '<li' + el_(path(ip, 'lines'), li) + '><span' + ep(path(ip, 'lines', li)) + '>' + esc(ln) + '</span></li>';
      });
      h += '</ul></div>';
    });
    return h + '</div>';
  }

  function rNote(b, bp) {
    return '<div class="protect">'
         + '<h4' + ep(path(bp, 'title')) + '>' + esc(b.title) + '</h4>'
         + '<p' + ep(path(bp, 'html'), 'html') + '>' + (b.html || '') + '</p>'
         + '</div>';
  }

  var RENDERERS = { stats: rStats, bars: rBars, cards: rCards, tags: rTags, table: rTableBlock, steps: rSteps, ports: rPorts, note: rNote };

  /* ---------------- 整页渲染 ---------------- */
  function render() {
    var D = DATA;

    /* Hero */
    document.getElementById('heroRoot').innerHTML =
      '<div class="hero-inner">'
    +   '<div class="hero-tag"' + ep('hero.tag') + '>' + esc(D.hero.tag) + '</div>'
    +   '<h1' + ep('hero.title') + '>' + esc(D.hero.title) + '</h1>'
    +   '<p' + ep('hero.desc') + '>' + esc(D.hero.desc) + '</p>'
    +   '<div class="hero-meta">'
    +     (D.hero.chips || []).map(function (c, i) {
            return '<span' + ep(path('hero', 'chips', i, 'text')) + el_(path('hero', 'chips'), i) + '>' + esc(c.text) + '</span>';
          }).join('')
    +   '</div>'
    + '</div>';

    /* KPI */
    document.getElementById('kpiRoot').innerHTML = (D.kpis || []).map(function (k, i) {
      var ip = path('kpis', i);
      // 值超过 4 个字符就当「文字型」处理：字号缩小并禁止换行，否则长句会把 4 列撑破。
      // 自动判定是为了配合编辑模式——用户在页面上把数字改成一句话也不会破版。
      var ncls = 'n' + (String(k.value || '').length > 4 ? ' is-text' : '');
      // 有 chips 的格子不放数字，改放一组能力标签（如 AI 那一格）
      var big = (k.chips && k.chips.length)
        ? '<div class="kc">' + k.chips.map(function (c, ci) {
            return '<span' + ep(path(ip, 'chips', ci)) + el_(path(ip, 'chips'), ci) + '>' + esc(c) + '</span>';
          }).join('') + '</div>'
        : '<div class="' + ncls + '"' + ep(path(ip, 'value')) + '>' + esc(k.value) + '</div>';
      return '<div class="kpi" style="--k:' + esc(k.color || '#1a56db') + '"' + el_('kpis', i) + '>'
           +   big
           +   '<div class="l"' + ep(path(ip, 'label')) + '>' + esc(k.label) + '</div>'
           +   '<div class="s"' + ep(path(ip, 'sub')) + '>' + esc(k.sub) + '</div>'
           + '</div>';
    }).join('');

    /* 正文各段 */
    document.getElementById('sectionsRoot').innerHTML = (D.sections || []).map(function (s, si) {
      var sp = path('sections', si);
      var white = s.tone === 'white';
      var body = (s.blocks || []).map(function (b, bi) {
        var bp = path(sp, 'blocks', bi);
        var fn = RENDERERS[b.type];
        return fn ? fn(b, bp) : '';
      }).join('');
      var head = '<div class="sec-head">'
               +   '<div class="kicker"' + ep(path(sp, 'kicker')) + '>' + esc(s.kicker) + '</div>'
               +   '<h2><span class="ico"' + ep(path(sp, 'icon')) + '>' + esc(s.icon) + '</span>'
               +   '<span' + ep(path(sp, 'title')) + '>' + esc(s.title) + '</span></h2>'
               +   '<p' + ep(path(sp, 'desc')) + '>' + esc(s.desc) + '</p>'
               + '</div>';
      var wrapOpen = white
        ? '<div class="tone-white" style="background:#fff; border-top:1px solid var(--border); border-bottom:1px solid var(--border)">'
        : '';
      var wrapClose = white ? '</div>' : '';
      return wrapOpen + '<div class="wrap"><section' + el_('sections', si) + '>' + head + body + '</section></div>' + wrapClose;
    }).join('');

    /* 页脚 */
    var F = D.footer;
    document.getElementById('footerRoot').innerHTML =
        '<div><b' + ep('footer.title') + '>' + esc(F.title) + '</b></div>'
      + (F.lines || []).map(function (l, i) {
          return '<div' + (i === 1 ? ' style="margin-top:10px; opacity:.75"' : '') + el_('footer.lines', i) + '><span' + ep(path('footer', 'lines', i)) + '>' + esc(l) + '</span></div>';
        }).join('');

    if (editing) bindEditors();
  }

  /* ---------------- 编辑器绑定 ---------------- */
  function bindEditors() {
    document.querySelectorAll('[data-p]').forEach(function (el) {
      var p = el.getAttribute('data-p');
      var html = el.getAttribute('data-html') === '1';
      el.addEventListener('input', function () {
        setPath(DATA, p, html ? el.innerHTML : el.textContent);
        dirty = true;
        setBarState();
      });
      // 数字型字段只保留纯数字，避免行内公式被塞进条形图
      if (/\bvalue$/.test(p)) {
        el.addEventListener('blur', function () {
          var n = String(el.textContent).replace(/[^\d.]/g, '');
          el.textContent = n;
          setPath(DATA, p, n);
          render();
        });
      }
    });

    document.querySelectorAll('[data-list]').forEach(function (el) {
      var lp = el.getAttribute('data-list');
      var i = parseInt(el.getAttribute('data-i'), 10);
      if (el.querySelector(':scope > .etools')) return;
      var bar = document.createElement('div');
      bar.className = 'etools';
      bar.innerHTML = '<button data-act="up"   title="上移">↑</button>'
                    + '<button data-act="down" title="下移">↓</button>'
                    + '<button data-act="add"  title="在后面插入一条">＋</button>'
                    + '<button data-act="del"  title="删除" class="del">🗑</button>';
      bar.addEventListener('click', function (e) {
        var act = e.target.getAttribute && e.target.getAttribute('data-act');
        if (!act) return;
        e.preventDefault(); e.stopPropagation();
        var arr = getPath(DATA, lp);
        if (!Array.isArray(arr)) return;
        if (act === 'up'   && i > 0)                 { var t = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = t; }
        else if (act === 'down' && i < arr.length-1) { var u = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = u; }
        else if (act === 'add')  { arr.splice(i + 1, 0, blankLike(arr[i])); }
        else if (act === 'del')  { arr.splice(i, 1); }
        dirty = true;
        render(); setBarState();
      });
      el.insertBefore(bar, el.firstChild);
    });
  }

  /* 造一条「同形状的空白条目」：保留颜色/单位等样式字段，清掉文字 */
  var KEEP = { c: 1, tone: 1, color: 1, style: 1 };
  function blankLike(src) {
    if (src == null) return '';
    if (typeof src === 'string') return '';
    if (typeof src === 'number') return 0;
    if (typeof src === 'boolean') return src;
    if (Array.isArray(src)) return src.map(blankLike);
    var out = {};
    Object.keys(src).forEach(function (k) {
      if (KEEP[k]) { out[k] = clone(src[k]); return; }
      if (typeof src[k] === 'string') {
        // 颜色值 / 渐变保留，其余清空
        out[k] = /^#[0-9a-fA-F]{3,8}$/.test(src[k]) ? src[k] : '';
      } else {
        out[k] = clone(src[k]);
        if (out[k] && typeof out[k] === 'object') out[k] = blankLike(out[k]);
      }
    });
    return out;
  }

  /* ---------------- 保存 / 载入 ---------------- */
  function setBarState() {
    var s = document.getElementById('ebState');
    if (s) s.textContent = dirty ? '编辑模式 · 有未保存的改动' : '编辑模式';
  }

  function toast(msg, ok) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (ok ? ' ok' : '');
    setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  function load() {
    return fetch(API + '?_=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { return (j && j.data) ? j.data : null; })
      .catch(function () { return null; });
  }

  function save() {
    if (!UID) { toast('未取到登录用户，无法保存'); return; }
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: UID, data: DATA })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) throw new Error(res.j.message || ('HTTP ' + res.ok));
        dirty = false;
        toast('✅ 已保存，所有访客都能看到', true);
        setTimeout(function () { location.reload(); }, 900);
      })
      .catch(function (e) { toast('保存失败：' + e.message); });
  }

  function reset() {
    if (!confirm('恢复为内置默认内容？服务端保存的修改会被清空。')) return;
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: UID, data: null })
    }).then(function () { location.reload(); });
  }

  /* ---------------- 启动 ---------------- */
  function start(data) {
    DATA = data || clone(DEFAULT);
    if (!DATA.sections) DATA = clone(DEFAULT);   // 服务端数据损坏时兜底
    render();

    var toggle = document.getElementById('editToggle');
    var bar = document.getElementById('editBar');

    if (IS_ADMIN) {
      toggle.hidden = false;
      toggle.onclick = function () {
        editing = true;
        document.body.classList.add('editing');
        bar.hidden = false;
        toggle.hidden = true;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      document.getElementById('ebSave').onclick = save;
      document.getElementById('ebReset').onclick = reset;
      document.getElementById('ebCancel').onclick = function () {
        if (dirty && !confirm('有未保存的改动，确定放弃？')) return;
        location.reload();
      };
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    load().then(start);
  });
})();
</script>
</body>
</html>
