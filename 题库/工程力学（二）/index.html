<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程力学题库 - 题库主页</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="js/katex/katex.min.css">
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="brand"><span class="logo">📚</span> 工程力学题库</div>
  <div class="nav-links">
    <a href="index.html" class="active">题库主页</a>
    <a href="upload.html">✏️ 上传题目</a>
  </div>
</div>

<!-- 页头 -->
<header class="page-header">
  <h1>📝 工程力学题库</h1>
  <p>理论力学 · 材料力学 | 三级分类标签 · 公式 / 图片 / 音视频解析 | <span id="totalCount">--</span> 道题</p>
</header>

<div class="container">

  <!-- 统计 -->
  <div class="stats-panel">
    <div class="stat-card"><div class="stat-val" id="statTotal">--</div><div class="stat-lbl">总题量</div></div>
    <div class="stat-card"><div class="stat-val" id="statSubjects">--</div><div class="stat-lbl">学科（一级）</div></div>
    <div class="stat-card"><div class="stat-val" id="statCats">--</div><div class="stat-lbl">知识大类（二级）</div></div>
    <div class="stat-card"><div class="stat-val" id="statKPs">--</div><div class="stat-lbl">知识点（三级）</div></div>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <input type="text" id="qSearch" placeholder="🔍 搜索概述 / 题目 / 答案 / 标签…" oninput="filterQuestions()">
    <select id="qSubject" title="学科（一级标签）" onchange="onSubjectChange()"><option value="all">全部学科</option></select>
    <select id="qCategory" title="知识大类（二级标签）" onchange="onCategoryChange()"><option value="all">全部大类</option></select>
    <select id="qKP" title="知识点（三级标签）" onchange="filterQuestions()"><option value="all">全部知识点</option></select>
    <select id="qDifficulty" title="难度" onchange="filterQuestions()">
      <option value="all">全部难度</option>
      <option value="easy">基础</option>
      <option value="medium">中等</option>
      <option value="hard">困难</option>
    </select>
    <select id="qType" title="题型" onchange="filterQuestions()"><option value="all">全部题型</option></select>
    <select id="qSource" title="来源" onchange="filterQuestions()"><option value="all">全部来源</option></select>
    <button class="btn btn-ghost" onclick="resetFilter()">重置</button>
    <button class="btn btn-primary" onclick="location.href='upload.html'">✏️ 上传</button>
  </div>

  <!-- 题目列表 -->
  <div class="question-grid" id="questionGrid"></div>
  <div class="pagination" id="questionPagination"></div>
  <div class="footer">本系统数据全部保存在本地 qdata 文件夹，运行 server.py 后使用。</div>
</div>

<!-- ============ 详情弹窗 ============ -->
<div class="modal-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal-dialog" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">题目</div>
      <div class="hdr-actions">
        <button class="icon-btn" onclick="editCurrentQuestion()" title="编辑此题">✎</button>
        <button class="icon-btn danger" onclick="deleteCurrentQuestion()" title="删除此题">🗑</button>
        <button class="icon-btn" onclick="closeDetail()" title="关闭">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/katex/katex.min.js"></script>
<script src="js/katex/contrib/auto-render.min.js"></script>
<script>
// ==================== 状态 ====================
let allQuestions = [];
let tagIndex = { subjects: {} };
const PER_PAGE = 12;
let currentPage = 1;
let currentFiltered = [];
let currentDetailId = null;
let revealState = 0; // 0=仅题目 1=展示答案 2=展示解析
const filterState = { search: '', subject: 'all', category: 'all', difficulty: 'all', kp: 'all', type: 'all', source: 'all' };

// ==================== 数据加载 ====================
async function init() {
  addModeBadge();
  await loadTtsPrompt();
  await loadTags();
  await loadQuestions();
  buildTagIndex();
  updateStats();
  buildFilterCascades();
  filterQuestions();
}

async function loadQuestions() {
  allQuestions = await QStore.list();
}

// 把 tags.json 与题目实际数据合并成统一索引
function buildTagIndex() {
  tagIndex = { subjects: {} };
  (TAG_DATA.subjects || []).forEach(s => {
    tagIndex.subjects[s.name] = { name: s.name, categories: {} };
    (s.categories || []).forEach(c => {
      tagIndex.subjects[s.name].categories[c.name] = { name: c.name, points: new Set(c.knowledge_points || []) };
    });
  });
  allQuestions.forEach(q => {
    const subj = q.subject || '未分类';
    if (!tagIndex.subjects[subj]) tagIndex.subjects[subj] = { name: subj, categories: {} };
    const cat = q.category || '未分类';
    if (!tagIndex.subjects[subj].categories[cat]) tagIndex.subjects[subj].categories[cat] = { name: cat, points: new Set() };
    (q.knowledge_points || []).forEach(p => tagIndex.subjects[subj].categories[cat].points.add(p));
  });
}

function updateStats() {
  const subjects = new Set(allQuestions.map(q => q.subject).filter(Boolean));
  const cats = new Set(allQuestions.map(q => q.category).filter(Boolean));
  const kps = new Set();
  allQuestions.forEach(q => (q.knowledge_points || []).forEach(p => kps.add(p)));
  document.getElementById('totalCount').textContent = allQuestions.length;
  document.getElementById('statTotal').textContent = allQuestions.length;
  document.getElementById('statSubjects').textContent = subjects.size;
  document.getElementById('statCats').textContent = cats.size;
  document.getElementById('statKPs').textContent = kps.size;
}

// ==================== 三级级联筛选 ====================
function allSubjects() { return Object.keys(tagIndex.subjects); }

function categoriesFor(subject) {
  if (subject === 'all') {
    const set = new Set();
    allSubjects().forEach(s => Object.keys(tagIndex.subjects[s].categories).forEach(c => set.add(c)));
    return Array.from(set);
  }
  return Object.keys(tagIndex.subjects[subject] ? tagIndex.subjects[subject].categories : {});
}

function pointsFor(subject, category) {
  const set = new Set();
  if (subject === 'all' && category === 'all') {
    allSubjects().forEach(s => Object.keys(tagIndex.subjects[s].categories).forEach(c =>
      tagIndex.subjects[s].categories[c].points.forEach(p => set.add(p))));
  } else if (subject === 'all') {
    allSubjects().forEach(s => { const c = tagIndex.subjects[s].categories[category]; if (c) c.points.forEach(p => set.add(p)); });
  } else {
    const subj = tagIndex.subjects[subject];
    if (!subj) return [];
    if (category === 'all') {
      Object.keys(subj.categories).forEach(c => subj.categories[c].points.forEach(p => set.add(p)));
    } else {
      const c = subj.categories[category];
      if (c) c.points.forEach(p => set.add(p));
    }
  }
  return Array.from(set).sort();
}

function buildFilterCascades() {
  const subjSel = document.getElementById('qSubject');
  subjSel.innerHTML = '<option value="all">全部学科</option>' +
    allSubjects().map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join('');
  subjSel.value = filterState.subject;
  onSubjectChange();
  populateTypeOptions();
  populateSourceOptions();
}

function populateSourceOptions() {
  const sel = document.getElementById('qSource');
  if (!sel) return;
  const srcs = new Set((TAG_DATA.sources && TAG_DATA.sources.length) ? TAG_DATA.sources : []);
  allQuestions.forEach(q => { if (q.source) srcs.add(q.source); });
  sel.innerHTML = '<option value="all">全部来源</option>' +
    Array.from(srcs).map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join('');
  sel.value = filterState.source;
}

function populateTypeOptions() {
  const sel = document.getElementById('qType');
  if (!sel) return;
  // 合并配置题型 + 数据中实际出现的题型，保证都能筛选
  const types = new Set((TAG_DATA.question_types && TAG_DATA.question_types.length)
    ? TAG_DATA.question_types
    : ['判断题', '选择题', '填空题', '解答题', '证明题', '计算题']);
  allQuestions.forEach(q => { if (q.question_type) types.add(q.question_type); });
  sel.innerHTML = '<option value="all">全部题型</option>' +
    Array.from(types).map(t => '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>').join('');
  sel.value = filterState.type;
}

// 学科改变 → 重置大类与知识点，联动筛选
function onSubjectChange() {
  filterState.subject = document.getElementById('qSubject').value;
  filterState.category = 'all';
  populateCategoryOptions();
  filterState.kp = 'all';
  populateKPOptions();
  filterQuestions();
}

// 大类改变 → 重置知识点，联动筛选
function onCategoryChange() {
  filterState.category = document.getElementById('qCategory').value;
  filterState.kp = 'all';
  populateKPOptions();
  filterQuestions();
}

function populateCategoryOptions() {
  const catSel = document.getElementById('qCategory');
  catSel.innerHTML = '<option value="all">全部大类</option>' +
    categoriesFor(filterState.subject).map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join('');
  catSel.value = 'all';
}

function populateKPOptions() {
  const kpSel = document.getElementById('qKP');
  kpSel.innerHTML = '<option value="all">全部知识点</option>' +
    pointsFor(filterState.subject, filterState.category).map(p => '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>').join('');
  kpSel.value = 'all';
}

// ==================== 搜索 / 筛选 / 渲染 ====================
function filterQuestions() {
  currentPage = 1;
  const search = document.getElementById('qSearch').value.toLowerCase();
  const diff = document.getElementById('qDifficulty').value;
  // 从下拉框同步题型/来源筛选值
  const typeSel = document.getElementById('qType');
  if (typeSel) filterState.type = typeSel.value;
  const srcSel = document.getElementById('qSource');
  if (srcSel) filterState.source = srcSel.value;

  const filtered = allQuestions.filter(q => {
    // 学科 / 大类 / 知识点
    if (filterState.subject !== 'all' && q.subject !== filterState.subject) return false;
    if (filterState.category !== 'all' && q.category !== filterState.category) return false;
    if (filterState.kp !== 'all' && (q.knowledge_points || []).indexOf(filterState.kp) < 0) return false;
    if (filterState.type !== 'all' && q.question_type !== filterState.type) return false;
    if (filterState.source !== 'all' && q.source !== filterState.source) return false;
    if (diff !== 'all' && q.difficulty !== diff) return false;
    // 全文搜索
    if (search) {
      const hay = (
        (q.overview || '') + ' ' + (q.subject || '') + ' ' + (q.category || '') + ' ' +
        (q.knowledge_points || []).join(' ') + ' ' +
        stripHtml(q.content) + ' ' + stripHtml(q.answer) + ' ' + stripHtml(q.explanation)
      ).toLowerCase();
      if (hay.indexOf(search) < 0) return false;
    }
    return true;
  });
  currentFiltered = filtered;
  renderGrid(filtered);
}

function renderGrid(data) {
  const grid = document.getElementById('questionGrid');
  const total = Math.ceil(data.length / PER_PAGE);
  if (currentPage > total) currentPage = total || 1;

  if (data.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>😕 没有找到匹配的题目</p><small>请尝试调整搜索或筛选条件</small></div>';
    document.getElementById('questionPagination').innerHTML = '';
    return;
  }

  const page = data.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);
  grid.innerHTML = page.map(q => {
    const kps = (q.knowledge_points || []).slice(0, 4).map(p => '<span class="q-tag">' + escapeHtml(p) + '</span>').join('');
    const more = (q.knowledge_points || []).length > 4 ? '<span class="q-tag">+' + ((q.knowledge_points || []).length - 4) + '</span>' : '';
    return '<div class="question-card" onclick="openDetail(\'' + q.id + '\')">'
      + '<button class="card-delete-btn" onclick="event.stopPropagation();deleteQuestion(\'' + q.id + '\')" title="删除此题">×</button>'
      + '<div class="q-id">#' + escapeHtml(q.id) + '</div>'
      + '<h3>' + escapeHtml(q.overview || '(无概述)') + '</h3>'
      + '<div class="q-meta">'
      + '<span class="q-diff ' + escapeHtml(q.difficulty || 'medium') + '">' + diffLabel(q.difficulty) + '</span>'
      + '<span class="q-tag subj">' + escapeHtml(q.subject || '') + '</span>'
      + '<span class="q-tag cat">' + escapeHtml(q.category || '') + '</span>'
      + '<span class="q-tag type">' + escapeHtml(q.question_type || '') + '</span>'
      + (q.source ? '<span class="q-tag src">' + escapeHtml(q.source) + '</span>' : '')
      + kps + more
      + '<span class="q-date">' + formatDate(q.updated || q.created) + '</span>'
      + '</div></div>';
  }).join('');

  renderPagination(total);
}

function renderPagination(total) {
  const pg = document.getElementById('questionPagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let h = '<button ' + (currentPage === 1 ? 'disabled' : 'onclick="goPage(' + (currentPage - 1) + ')"') + '>◀</button>';
  for (let i = 1; i <= total; i++) {
    if (total > 7 && i > 3 && i < total - 1 && i !== currentPage && Math.abs(i - currentPage) > 2) {
      if (i === 4 || i === total - 2) h += '<span class="ellipsis">…</span>';
      continue;
    }
    h += '<button ' + (i === currentPage ? 'class="active"' : 'onclick="goPage(' + i + ')"') + '>' + i + '</button>';
  }
  h += '<button ' + (currentPage === total ? 'disabled' : 'onclick="goPage(' + (currentPage + 1) + ')"') + '>▶</button>';
  pg.innerHTML = h;
}

function goPage(n) {
  currentPage = n;
  renderGrid(currentFiltered);
  document.getElementById('questionGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetFilter() {
  document.getElementById('qSearch').value = '';
  document.getElementById('qDifficulty').value = 'all';
  filterState.subject = 'all'; filterState.category = 'all'; filterState.kp = 'all'; filterState.type = 'all'; filterState.source = 'all';
  document.getElementById('qSubject').value = 'all';
  populateCategoryOptions();
  populateKPOptions();
  populateTypeOptions();
  populateSourceOptions();
  filterQuestions();
}

// ==================== 详情弹窗 ====================
function getQuestion(id) {
  return allQuestions.find(q => q.id === id);
}

function openDetail(id) {
  const q = getQuestion(id);
  if (!q) return;
  currentDetailId = id;
  revealState = 0;

  document.getElementById('modalTitle').textContent = '#' + q.id + ' · ' + (q.subject || '') + ' / ' + (q.category || '');

  const body = document.getElementById('modalBody');
  body.innerHTML =
    '<div class="overview-block"><b>题目概述：</b>' + escapeHtml(q.overview || '') + '</div>'
    + '<div class="section-label"><span class="dot"></span>题 目</div>'
    + '<div class="detail-content">' + fixMediaSrc(q.content, q.id) + '</div>'
    + '<div class="detail-divider"></div>'
    + '<div class="reveal-section" id="answerSection">'
    +   '<div class="section-label"><span class="dot" style="background:var(--accent)"></span>答 案</div>'
    +   '<div class="answer-content">' + fixMediaSrc(q.answer, q.id) + '</div>'
    + '</div>'
    + '<div class="reveal-section" id="explainSection">'
    +   '<div class="section-label"><span class="dot" style="background:var(--green)"></span>解 析</div>'
    +   '<div class="explain-content">' + fixMediaSrc(q.explanation, q.id) + '</div>'
    +   '<div class="detail-divider"></div>'
    +   '<div id="narrationArea">' + buildNarrationArea(q) + '</div>'
    + '</div>'
    + '<button class="reveal-bar" id="revealBar" onclick="advanceReveal()">▼ 点击查看答案</button>';

  // 页脚
  const kps = (q.knowledge_points || []).map(p => '<span class="q-tag">' + escapeHtml(p) + '</span>').join(' ');
  document.getElementById('modalFooter').innerHTML =
    '<span class="q-diff ' + escapeHtml(q.difficulty || 'medium') + '">' + diffLabel(q.difficulty) + '</span> '
    + '<span class="q-tag subj">' + escapeHtml(q.subject || '') + '</span>'
    + '<span class="q-tag cat">' + escapeHtml(q.category || '') + '</span>'
    + '<span class="q-tag type">' + escapeHtml(q.question_type || '') + '</span>'
    + (q.source ? '<span class="q-tag src">' + escapeHtml(q.source) + '</span>' : '')
    + kps
    + '<span style="margin-left:auto">📅 ' + escapeHtml((q.updated || q.created) || '') + '</span>';

  // 渲染公式
  renderMathIn(body);

  document.getElementById('detailOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

// 点击逐级展示：题目 → 答案 → 解析
function advanceReveal() {
  const bar = document.getElementById('revealBar');
  if (revealState === 0) {
    revealState = 1;
    document.getElementById('answerSection').classList.add('visible');
    bar.textContent = '▼ 点击查看解析';
  } else if (revealState === 1) {
    revealState = 2;
    document.getElementById('explainSection').classList.add('visible');
    renderMathIn(document.getElementById('explainSection'));
    bar.textContent = '✔ 已展示全部内容';
    bar.style.opacity = '0.55';
    bar.style.cursor = 'default';
  }
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('active');
  document.body.style.overflow = '';
  currentDetailId = null;
}

// 详情弹窗：自动讲解区域（音频 + 讲解词 + 生成/重新生成）
function buildNarrationArea(q) {
  const n = q.narration;
  let html = narrationHtml(q);
  html += '<div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + '<select id="narrVoice" style="padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.85em;font-family:inherit;background:#fff">'
    + voiceSelectHtml(n ? n.voice : 'girl') + '</select>'
    + '<button class="btn btn-green" style="padding:7px 16px;font-size:0.82em" onclick="doGenerateNarration(\'' + q.id + '\')">'
    + (n ? '🔄 重新生成' : '🎙 生成讲解') + '</button>'
    + (n ? '<button class="btn btn-ghost" style="padding:7px 16px;font-size:0.82em;color:var(--red);border-color:#f5b5b0" onclick="deleteNarration(\'' + q.id + '\')">🗑 删除讲解</button>' : '')
    + (isOffline()
      ? '<span style="font-size:0.78em;color:var(--text-lighter)">（离线模式仅可播放已有音频；生成需在服务器模式下进行）</span>'
      : '')
    + '</div>';
  return html;
}

async function doGenerateNarration(qid) {
  if (isOffline()) { toast('离线模式无法生成音频文件', 'error'); return; }
  const voice = document.getElementById('narrVoice').value;
  const btn = event && event.currentTarget;
  if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }
  const n = await generateNarration(qid, voice);
  if (btn) { btn.disabled = false; btn.textContent = '🔄 重新生成'; }
  if (n) {
    toast('讲解音频已生成（' + n.voice_label + '）', 'success');
    // 只刷新讲解区块，保持解析展开状态不被重置
    const q = getQuestion(qid);
    if (q) {
      q.narration = n;
      upsertLocalQuestion(q);
      const area = document.getElementById('narrationArea');
      if (area) area.innerHTML = buildNarrationArea(q);
    }
  }
}

async function deleteNarration(qid) {
  if (!confirm('确定删除该题的讲解音频吗？')) return;
  if (isOffline()) {
    const qs = localQuestions();
    const q = qs.find(x => x.id === qid);
    if (q && q.narration) { delete q.narration; saveLocalQuestions(qs); }
    const area = document.getElementById('narrationArea');
    if (area) area.innerHTML = buildNarrationArea(q || { id: qid });
    return;
  }
  try {
    await api('api/narrate?id=' + qid, { method: 'DELETE' });
    const q = getQuestion(qid);
    if (q) { delete q.narration; upsertLocalQuestion(q); }
    const area = document.getElementById('narrationArea');
    if (area) area.innerHTML = buildNarrationArea(q || { id: qid });
    toast('讲解音频已删除', 'success');
  } catch (e) {
    toast(e.message, 'error');
  }
}

function editCurrentQuestion() {
  if (!currentDetailId) return;
  location.href = 'upload.html?id=' + currentDetailId;
}

function deleteCurrentQuestion() {
  if (!currentDetailId) return;
  deleteQuestion(currentDetailId);
  closeDetail();
}

async function deleteQuestion(id) {
  if (!confirm('确定要删除题目 ' + id + ' 吗？此操作不可恢复。')) return;
  try {
    const r = await QStore.remove(id);
    toast('题目 ' + id + ' 已删除' + (r.offline ? '（离线模式）' : ''), 'success');
    await loadQuestions();
    buildTagIndex();
    updateStats();
    buildFilterCascades();
    filterQuestions();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ==================== 初始化 ====================
init();
</script>
</body>
</html>
